<div class="mb-4 flex items-center">
  @for (star of starsArray; track star) {
    <app-icon
      icon="{{ star }}"
      classNames="{{ classes }}"
    ></app-icon>
  }
  @if (showRatingNumber) {
    <span
      class="ml-3 mr-2 rounded bg-yellow-200 px-2.5 py-0.5 text-xs font-semibold"
      >{{ rating }}</span
      >
    }
  </div>
