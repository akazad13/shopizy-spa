<div class="flex items-center gap-x-1">
  <ng-container *ngFor="let star of starsArray; let i = index; trackBy: trackByIndex">
    <app-icon [icon]="star" [classNames]="classes"></app-icon>
  </ng-container>
  <span *ngIf="showRatingNumber"
    class="ml-2 rounded-md bg-amber-50 px-1.5 py-0.5 text-xs font-semibold text-amber-600 ring-1 ring-amber-200">{{
    rating }}</span>
</div>
