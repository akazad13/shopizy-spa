<div class="mb-4 flex items-center">
  <ng-container *ngFor="let star of starsArray; let i = index; trackBy: trackByIndex">
    <app-icon [icon]="star" [classNames]="classes"></app-icon>
  </ng-container>
  <span *ngIf="showRatingNumber" class="ml-3 mr-2 rounded bg-yellow-200 px-2.5 py-0.5 text-xs font-semibold">{{ rating }}</span>
</div>
