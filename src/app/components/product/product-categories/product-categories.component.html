<section class="bg-gray-50 py-12 sm:py-16">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">

    <!-- Section header -->
    <div class="mb-8 flex items-end justify-between">
      <div>
        <p class="text-xs font-semibold uppercase tracking-wider text-indigo-500">Collections</p>
        <h2 class="mt-1 text-2xl font-bold tracking-tight text-gray-900 sm:text-3xl">Shop by Category</h2>
      </div>
      <a href="/shop"
        class="hidden items-center gap-x-1 text-sm font-medium text-indigo-600 hover:text-indigo-700 sm:flex">
        Browse all
        <app-icon icon="chevron-right" classNames="h-4 w-4"></app-icon>
      </a>
    </div>

    <!-- Image mosaic -->
    <div class="grid grid-cols-1 gap-5 lg:grid-cols-2">

      <!-- Featured large image -->
      <div class="group relative overflow-hidden rounded-2xl shadow-sm">
        <img src="https://tailwindui.com/img/ecommerce-images/product-page-02-featured-product-shot.jpg"
          alt="Featured category — plain white basic tee"
          class="h-full w-full object-cover object-center transition-transform duration-500 group-hover:scale-105"
          style="aspect-ratio: 4/3;" />
        <div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
        <div class="absolute bottom-4 left-4">
          <span class="rounded-lg bg-white/90 px-3 py-1.5 text-sm font-semibold text-gray-900 backdrop-blur-sm shadow">
            Basics
          </span>
        </div>
      </div>

      <!-- Two stacked images -->
      <div class="grid grid-rows-2 gap-5">
        <div class="group relative overflow-hidden rounded-2xl shadow-sm">
          <img src="https://tailwindui.com/img/ecommerce-images/product-page-02-tertiary-product-shot-01.jpg"
            alt="Category — plain black basic tee"
            class="h-full w-full object-cover object-center transition-transform duration-500 group-hover:scale-105" />
          <div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
          <div class="absolute bottom-3 left-3">
            <span
              class="rounded-lg bg-white/90 px-3 py-1.5 text-sm font-semibold text-gray-900 backdrop-blur-sm shadow">
              Essentials
            </span>
          </div>
        </div>
        <div class="group relative overflow-hidden rounded-2xl shadow-sm">
          <img src="https://tailwindui.com/img/ecommerce-images/product-page-02-tertiary-product-shot-02.jpg"
            alt="Category — plain gray basic tee"
            class="h-full w-full object-cover object-center transition-transform duration-500 group-hover:scale-105" />
          <div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
          <div class="absolute bottom-3 left-3">
            <span
              class="rounded-lg bg-white/90 px-3 py-1.5 text-sm font-semibold text-gray-900 backdrop-blur-sm shadow">
              Classics
            </span>
          </div>
        </div>
      </div>
    </div>

  </div>
</section>
