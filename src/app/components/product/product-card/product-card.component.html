<div
  class="group relative flex w-full flex-col overflow-hidden rounded-2xl border border-gray-100 bg-white shadow-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-md cursor-pointer"
  [routerLink]="['/', 'product', productId]">

  <!-- Image wrapper -->
  <div class="relative overflow-hidden bg-gray-50" style="aspect-ratio: 3/3;">
    <img class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105"
      [src]="imageUrl" [alt]="product.name" />

    <!-- Badges container -->
    <div class="absolute left-3 top-3 flex flex-col gap-1 z-10">
      <span *ngIf="hasDiscount"
        class="rounded-full bg-rose-500 px-2.5 py-0.5 text-xs font-bold text-white shadow">
        −{{ discount }}%
      </span>
      <span *ngIf="isBogo"
        class="rounded-full bg-amber-500 px-2.5 py-0.5 text-xs font-bold text-white shadow">
        BOGO
      </span>
      <span *ngIf="isFreeShipping"
        class="rounded-full bg-emerald-600 px-2.5 py-0.5 text-xs font-bold text-white shadow">
        Free Shipping
      </span>
    </div>

    <!-- Wishlist button -->
    <button type="button" (click)="toggleWishlist($event)"
      class="absolute right-3 top-3 z-10 flex h-8 w-8 items-center justify-center rounded-full bg-white/80 text-gray-400 shadow-sm backdrop-blur-sm transition-all duration-200 hover:bg-white hover:text-rose-500"
      [class.text-rose-500]="isInWishlist()">
      <app-icon [icon]="isInWishlist() ? 'heart-solid' : 'heart-outline'" classNames="h-5 w-5"></app-icon>
    </button>

    <!-- Quick-view overlay -->
    <div
      class="absolute inset-x-0 bottom-0 translate-y-full bg-indigo-600/90 py-2.5 text-center text-xs font-semibold uppercase tracking-wider text-white backdrop-blur-sm transition-transform duration-300 group-hover:translate-y-0">
      View Details
    </div>
  </div>

  <!-- Info -->
  <div class="flex flex-1 flex-col gap-y-2 p-4">

    <!-- Name -->
    <h3 class="line-clamp-2 text-sm font-semibold leading-snug text-gray-800">
      {{ product.name }}
    </h3>

    <!-- Rating -->
    <app-rating [rating]="rating" [maxRating]="5.0" [classes]="'h-3.5 w-3.5'"
      [showRatingNumber]="true"></app-rating>

    <!-- Price row and Add to Cart -->
    <div class="mt-auto flex items-center justify-between gap-x-2">
      <div class="flex items-baseline gap-x-1.5">
        <span class="text-lg font-bold text-gray-900">
          ${{ finalPrice | number:'1.2-2' }}
        </span>
        <span *ngIf="hasDiscount" class="text-xs text-gray-400 line-through">
          ${{ originalPrice | number:'1.2-2' }}
        </span>
      </div>

      <button type="button" (click)="addToCart($event)"
        class="add-to-cart-btn flex h-9 w-9 items-center justify-center rounded-lg bg-indigo-50 text-indigo-600 transition-all duration-200 hover:bg-indigo-600 hover:text-white"
        title="Add to cart">
        <app-icon icon="plus" classNames="h-5 w-5"></app-icon>
      </button>
    </div>

  </div>

</div>
