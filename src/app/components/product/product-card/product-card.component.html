<div
  class="relative flex w-full max-w-xs flex-col overflow-hidden rounded-lg border border-gray-100 bg-white shadow-md"
>
  <a
    class="relative mx-3 mt-3 flex overflow-hidden rounded-xl lg:h-60"
    [routerLink]="['/', 'product', product?.productId]"
  >
    <img
      class="m-auto object-cover"
      [src]="product?.productImages?.[0]?.imageUrl"
      alt="{{ product?.name }}"
    />
    <span
      class="absolute left-0 top-0 m-2 rounded-full bg-black px-2 text-center text-sm font-medium text-white"
      >{{ product?.discount }}% OFF</span
    >
  </a>
  <div class="mt-4 px-5 pb-5">
    <a [routerLink]="['/', 'product', product?.productId]">
      <h5 class="text-xl tracking-tight text-slate-900">
        {{ product?.name }}
      </h5>
    </a>
    <div class="mt-2 flex items-center">
      <app-icon icon="star" classNames="h-5 w-5 text-yellow-300"></app-icon>
      <app-icon icon="star" classNames="h-5 w-5 text-yellow-300"></app-icon>
      <app-icon icon="star" classNames="h-5 w-5 text-yellow-300"></app-icon>
      <app-icon
        icon="half-star"
        classNames="h-5 w-5 text-yellow-300"
      ></app-icon>
      <app-icon icon="star" classNames="h-5 w-5 text-gray-400"></app-icon>

      <span
        class="ml-3 mr-2 rounded bg-yellow-200 px-2.5 py-0.5 text-xs font-semibold"
        >5.0</span
      >
    </div>
    <div class="mb-5 mt-2 flex items-center justify-between">
      <p>
        <span class="text-2xl font-bold text-slate-900"
          >${{
            product != null
              ? product.price - (product.price! * product.discount!) / 100
              : null
          }}</span
        >
        <span class="ps-1 text-sm text-slate-900 line-through"
          >${{ product?.price }}</span
        >
      </p>
    </div>
    <button
      (click)="updateCart(product)"
      class="flex w-full items-center justify-center rounded-md bg-indigo-600 px-5 py-2.5 text-center text-sm font-medium text-white hover:bg-indigo-700"
    >
      <app-icon icon="cart" classNames="mr-2 h-5 w-5"></app-icon>
      Add to cart
    </button>
  </div>
</div>
