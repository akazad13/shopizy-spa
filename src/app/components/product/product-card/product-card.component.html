<!-- Product card -->
<div
  class="group relative flex w-full flex-col overflow-hidden rounded-2xl border border-gray-100 bg-white shadow-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-md cursor-pointer"
  [routerLink]="['/', 'product', product.productId]">

  <!-- Image wrapper -->
  <div class="relative overflow-hidden bg-gray-50" style="aspect-ratio: 4/3;">
    <img class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105"
      [src]="product.productImages?.[0]?.imageUrl" [alt]="product.name" />

    <!-- Discount badge -->
    <span *ngIf="product.discount && product.discount > 0"
      class="absolute left-3 top-3 rounded-full bg-rose-500 px-2.5 py-1 text-xs font-bold text-white shadow">
      −{{ product.discount }}%
    </span>

    <!-- Quick-view overlay -->
    <div
      class="absolute inset-x-0 bottom-0 translate-y-full bg-indigo-600/90 py-2.5 text-center text-xs font-semibold uppercase tracking-wider text-white backdrop-blur-sm transition-transform duration-300 group-hover:translate-y-0">
      View Details
    </div>
  </div>

  <!-- Info -->
  <div class="flex flex-1 flex-col gap-y-2 p-4">

    <!-- Name -->
    <h5 class="line-clamp-2 text-sm font-semibold leading-snug text-gray-800">
      {{ product.name }}
    </h5>

    <!-- Rating -->
    <app-rating [rating]="product.averageRating.value" [maxRating]="5.0" [classes]="'h-3.5 w-3.5'"
      [showRatingNumber]="true"></app-rating>

    <!-- Price row -->
    <div class="mt-auto flex items-baseline gap-x-2">
      <span class="text-lg font-bold text-gray-900">
        ${{ (product.price - (product.price * product.discount) / 100) | number:'1.2-2' }}
      </span>
      <span *ngIf="product.discount > 0" class="text-sm text-gray-400 line-through">
        ${{ product.price }}
      </span>
    </div>

  </div>
</div>
