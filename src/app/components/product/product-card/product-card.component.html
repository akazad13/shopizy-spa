<div
  class="aspect-h-1 aspect-w-1 w-full overflow-hidden rounded-md bg-gray-200 lg:aspect-none group-hover:opacity-75 lg:h-80"
>
  <img
    [src]="product?.productImages?.[0]?.imageUrl"
    alt="Front of men&#039;s Basic Tee in black."
    class="h-full w-full object-cover object-center lg:h-full lg:w-full"
  />
</div>
<div class="mt-4 flex justify-between">
  <div>
    <h3 class="text-sm text-gray-700">
      <a [routerLink]="['/', 'products', product?.productId]">
        <span aria-hidden="true" class="absolute inset-0"></span>
        {{ product?.name }}
      </a>
    </h3>
    <p class="mt-1 text-sm text-gray-500">
      {{ product?.specifications?.[0]?.value }}
    </p>
  </div>
  <p class="text-sm font-medium text-gray-900">${{ product?.price }}</p>
</div>

<div class="m-auto mt-2 flex justify-center">
  <button
    (click)="updateCart(product)"
    class="m-auto w-full transform rounded-md bg-gray-200 px-5 py-2 text-sm font-semibold capitalize text-gray-800 transition-colors duration-300 hover:bg-gray-300 focus:bg-gray-300 focus:outline-none lg:w-auto"
  >
    Add to cart
  </button>
</div>
