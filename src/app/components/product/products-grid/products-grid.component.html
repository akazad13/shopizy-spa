<!-- Products grid -->
<div>
  <!-- Empty state -->
  <div *ngIf="products.length === 0" class="flex flex-col items-center justify-center py-20 text-center">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
      class="mb-4 h-14 w-14 text-gray-300">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007zM8.625 10.5a.375.375 0 11-.75 0 .375.375 0 01.75 0zm5.625 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
    </svg>
    <p class="text-base font-medium text-gray-500">No products found</p>
    <p class="mt-1 text-sm text-gray-400">Try adjusting your filters to see results.</p>
  </div>

  <!-- Grid -->
  <div *ngIf="products.length > 0"
    class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-3 2xl:grid-cols-4">
    <ng-container *ngFor="let product of products">
      <app-product-card [product]="product"></app-product-card>
    </ng-container>
  </div>
</div>
