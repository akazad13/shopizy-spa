<app-mobile-header [hideMobileMenu]="hideMobileMenu" [categoryTree]="categoryTree" [brands]="brands"
  (hideMobileMenuOutput)="showHideMobileDrawer($event)"></app-mobile-header>

<div class="sticky top-0 z-40 bg-white/95 backdrop-blur-sm">
  <header class="relative">

    <!-- Announcement bar -->
    <div class="flex h-9 items-center justify-center bg-indigo-600 px-4 text-xs font-medium text-white sm:px-6 lg:px-8">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"
        class="mr-2 h-4 w-4 text-indigo-300">
        <path
          d="M6.5 3c-1.051 0-2.093.04-3.125.117A1.49 1.49 0 002 4.607V10.5h9V4.606c0-.771-.59-1.43-1.375-1.489A41.35 41.35 0 006.5 3zM2 12v2.5A1.5 1.5 0 003.5 16h.041a3 3 0 015.918 0h.791a.75.75 0 00.75-.75V12H2z" />
        <path
          d="M6.5 18a1.5 1.5 0 100-3 1.5 1.5 0 000 3zM13.25 5a.75.75 0 00-.75.75v8.514a3.001 3.001 0 014.893 1.44c.37-.275.607-.714.607-1.204v-1a4 4 0 00-4-4h-.75V6.25a.75.75 0 00-.75-.75h-1.5a.75.75 0 000 1.5H13v5.75a.75.75 0 001.5 0V6.5h.75a2.5 2.5 0 012.5 2.5v1a.253.253 0 01-.094.197 3.01 3.01 0 00-3.93-.197V5.75A.75.75 0 0013.25 5z" />
      </svg>
      Free delivery on orders over $100 — Limited time offer
    </div>

    <!-- Main nav -->
    <nav aria-label="Top" class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
      <div class="flex h-16 items-center gap-x-4 border-b border-gray-100">

        <!-- Hamburger (mobile) -->
        <button type="button"
          class="flex h-9 w-9 items-center justify-center rounded-lg text-gray-500 transition hover:bg-gray-100 lg:hidden"
          (click)="showHideMobileDrawer('show')">
          <span class="sr-only">Open menu</span>
          <app-icon icon="bar-3" classNames="h-6 w-6"></app-icon>
        </button>

        <!-- Logo -->
        <a [routerLink]="['']" class="mr-4 flex-shrink-0">
          <span class="sr-only">Shopizy</span>
          <img class="h-9 w-auto" src="logo.png" alt="Shopizy" />
        </a>

        <!-- Category flyout nav -->
        <div class="hidden lg:flex lg:h-full lg:flex-1 lg:items-stretch lg:gap-x-6">
          <ng-container *ngFor="let parentCategory of categoryTree">
            <div class="flex items-stretch">
              <button type="button"
                class="flex items-center gap-x-1 border-b-2 pt-px text-sm font-medium transition-colors duration-150"
                [class.border-indigo-600]="selected === parentCategory.name"
                [class.text-indigo-600]="selected === parentCategory.name"
                [class.border-transparent]="selected !== parentCategory.name"
                [class.text-gray-600]="selected !== parentCategory.name"
                [class.hover:text-gray-900]="selected !== parentCategory.name"
                (click)="updateCategorySelection(parentCategory.name)">
                {{ parentCategory.name }}
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"
                  class="h-3.5 w-3.5 transition-transform duration-200"
                  [class.rotate-180]="selected === parentCategory.name">
                  <path fill-rule="evenodd"
                    d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z"
                    clip-rule="evenodd" />
                </svg>
              </button>

              <!-- Mega flyout panel -->
              <div *ngIf="selected === parentCategory.name" class="absolute inset-x-0 top-full z-20"
                appClickOutsideCategoryFlyout (clickOutside)="hideCategoryFlyout()">
                <div class="border-t border-gray-100 bg-white shadow-xl">
                  <div class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
                    <div class="grid grid-cols-3 gap-x-10 gap-y-8">
                      <!-- Featured images -->
                      <div class="col-span-1 space-y-4">
                        <div class="group overflow-hidden rounded-xl bg-gray-100">
                          <img
                            src="https://res.cloudinary.com/akazad13/image/upload/v1729420811/shopizy/soy4l9t0xba9dz2aq3li.jpg"
                            alt="New arrivals"
                            class="h-56 w-full object-cover object-center transition-transform duration-300 group-hover:scale-105" />
                        </div>
                      </div>

                      <!-- Category links -->
                      <div class="col-span-2 grid grid-cols-3 gap-x-8 gap-y-6 text-sm">
                        <ng-container *ngFor="let children of parentCategory.children">
                          <div>
                            <p class="mb-3 font-semibold text-gray-900">{{ children.name }}</p>
                            <ul class="space-y-2.5">
                              <ng-container *ngFor="let grandChildren of (children | toIterable)">
                                <li>
                                  <a [routerLink]="['/shop']" class="text-gray-500 transition hover:text-indigo-600">
                                    {{ grandChildren.name }}
                                  </a>
                                </li>
                              </ng-container>
                            </ul>
                          </div>
                        </ng-container>
                        <div>
                          <p class="mb-3 font-semibold text-gray-900">Brands</p>
                          <ul class="space-y-2.5">
                            <ng-container *ngFor="let brand of brands">
                              <li>
                                <a [routerLink]="['/shop']" class="text-gray-500 transition hover:text-indigo-600">{{
                                  brand }}</a>
                              </li>
                            </ng-container>
                          </ul>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </ng-container>

          <!-- Shop link -->
          <a [routerLink]="['/shop']"
            class="flex items-center border-b-2 border-transparent pt-px text-sm font-medium text-gray-600 transition hover:text-gray-900">Shop</a>
        </div>

        <!-- Right side actions -->
        <div class="ml-auto flex items-center gap-x-1 sm:gap-x-2">

          <!-- Auth links (logged out) -->
          @if (!isLoggedIn) {
          <div class="hidden items-center gap-x-4 lg:flex">
            <a [routerLink]="['auth/signin']"
              class="text-sm font-medium text-gray-600 transition hover:text-gray-900">Sign in</a>
            <a [routerLink]="['auth/signup']"
              class="rounded-lg bg-indigo-600 px-4 py-1.5 text-sm font-semibold text-white transition hover:bg-indigo-700">Create
              account</a>
          </div>
          }

          <!-- Account avatar (logged in) -->
          @if (isLoggedIn) {
          <div class="relative">
            <button
              class="account-dropdown-btn flex h-9 w-9 items-center justify-center rounded-full ring-2 ring-indigo-100 transition hover:ring-indigo-300"
              (click)="showHideAccountMenu(!hideAccountMenu)">
              <img class="account-dropdown-btn h-9 w-9 rounded-full object-cover"
                src="https://res.cloudinary.com/akazad13/image/upload/v1733996785/shopizy/default-user_sii97y.jpg"
                alt="Account" />
            </button>
            <div
              class="absolute right-0 z-20 mt-2 w-52 origin-top-right rounded-xl bg-white py-1.5 shadow-xl ring-1 ring-gray-100"
              role="menu" appClickOutsideAccount (clickOutside)="showHideAccountMenu(true)" [ngClass]="
                  hideAccountMenu
                    ? 'pointer-events-none scale-95 opacity-0 transition duration-100 ease-in'
                    : 'pointer-events-auto scale-100 opacity-100 transition duration-150 ease-out'
                ">
              <ng-container *ngFor="let menuItem of accountMenu">
                <button
                  class="block w-full px-4 py-2 text-left text-sm text-gray-700 transition hover:bg-indigo-50 hover:text-indigo-700"
                  (click)="onAccountMenuItemClick(menuItem)">{{ menuItem.label }}</button>
              </ng-container>
            </div>
          </div>
          }

          <!-- Currency -->
          <span
            class="hidden rounded-lg px-2 py-1.5 text-xs font-semibold text-gray-500 ring-1 ring-gray-200 lg:block">USD</span>

          <!-- Search -->
          <button type="button"
            class="flex h-9 w-9 items-center justify-center rounded-lg text-gray-500 transition hover:bg-gray-100">
            <span class="sr-only">Search</span>
            <app-icon icon="magnifying-glass" classNames="h-5 w-5"></app-icon>
          </button>

          <!-- Cart -->
          <div class="relative flex items-center">
            <button type="button"
              class="relative flex h-9 w-9 items-center justify-center rounded-lg text-gray-500 transition hover:bg-gray-100"
              (click)="updateDropCartSelection()">
              <app-icon icon="cart" classNames="h-5 w-5"></app-icon>
            </button>
            <!-- Badge: positioned on the outer div so it sits on the top-right corner of the button -->
            <span *ngIf="(cartSummary$ | async)?.totalItems"
              class="pointer-events-none absolute -right-1 -top-1 flex h-4 w-4 items-center justify-center rounded-full bg-indigo-600 text-[10px] font-bold leading-none text-white ring-2 ring-white">{{
              (cartSummary$ | async)?.totalItems }}</span>
            <app-dropcart [isDropCartOpened]="isDropCartOpened"></app-dropcart>
          </div>

        </div>
      </div>
    </nav>
  </header>
</div>
