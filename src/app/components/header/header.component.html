<div class="bg-white">
  <app-mobile-header
    [hideMobileMenu]="hideMobileMenu"
    [categoriesTree]="categoriesTree"
    [brands]="brands"
    (hideMobileMenuOutput)="showHideMobileDrawer($event)"
  ></app-mobile-header>

  <header class="relative bg-white">
    <p
      class="flex h-10 items-center justify-center bg-indigo-600 px-4 text-sm font-medium text-white sm:px-6 lg:px-8"
    >
      Get free delivery on orders over $100
    </p>

    <nav aria-label="Top" class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
      <div class="border-b border-gray-200">
        <div class="flex h-16 items-center">
          <!-- Mobile menu toggle -->
          <button
            type="button"
            class="mobile-menu-hamburger relative rounded-md bg-white p-2 text-gray-400 lg:hidden"
            (click)="showHideMobileDrawer('show')"
          >
            <span class="absolute -inset-0.5"></span>
            <span class="sr-only">Open menu</span>
            <app-icon icon="bar-3" classNames="h-6 w-6"></app-icon>
          </button>

          <!-- Logo -->
          <div class="ml-4 flex lg:ml-0">
            <a [routerLink]="['']">
              <span class="sr-only">Shopizy</span>
              <img class="h-10 w-auto" src="logo.png" alt="" />
            </a>
          </div>

          <!-- Flyout menus -->
          <div class="hidden lg:ml-8 lg:block lg:self-stretch">
            <div class="flex h-full space-x-8">
              <div class="flex" *ngFor="let parentCategory of categoriesTree">
                <div class="relative flex">
                  <button
                    type="button"
                    class="cat relative z-10 -mb-px flex items-center border-b-2 border-transparent pt-px text-sm font-medium text-gray-700 transition-colors duration-200 ease-out hover:text-gray-800"
                    aria-expanded="false"
                    (click)="updateCategorySelection(parentCategory.name)"
                    [ngClass]="
                      selected == parentCategory.name
                        ? 'border-indigo-600 text-indigo-600'
                        : 'border-transparent text-gray-700 hover:text-gray-800'
                    "
                  >
                    {{ parentCategory.name }}
                  </button>
                </div>
                <div
                  class="absolute inset-x-0 top-full z-10 text-sm text-gray-500"
                  *ngIf="selected == parentCategory.name"
                  appClickOutsideCategoryFlyout
                  (clickOutside)="hideCategoryFlyout()"
                >
                  <div
                    class="absolute inset-0 top-1/2 bg-white shadow"
                    aria-hidden="true"
                  ></div>

                  <div class="relative bg-white">
                    <div class="mx-auto max-w-7xl px-8">
                      <div class="grid grid-cols-2 gap-x-8 gap-y-10 py-16">
                        <div class="col-start-2 grid grid-cols-2 gap-x-8">
                          <div class="group relative text-base sm:text-sm">
                            <div
                              class="aspect-h-1 aspect-w-1 overflow-hidden rounded-lg bg-gray-100 group-hover:opacity-75"
                            >
                              <img
                                src="https://tailwindui.com/plus/img/ecommerce-images/mega-menu-category-01.jpg"
                                alt="Models sitting back to back, wearing Basic Tee in black and bone."
                                class="object-cover object-center"
                                *ngIf="parentCategory.name == 'Women'"
                              />

                              <img
                                src="https://res.cloudinary.com/akazad13/image/upload/v1729420811/shopizy/soy4l9t0xba9dz2aq3li.jpg"
                                alt="Models sitting back to back, wearing Basic Tee in black and bone."
                                class="object-cover object-center"
                                *ngIf="parentCategory.name == 'Men'"
                              />
                            </div>
                            <a
                              href="#"
                              class="mt-6 block font-medium text-gray-900"
                            >
                              <span
                                class="absolute inset-0 z-10"
                                aria-hidden="true"
                              ></span>
                              New Arrivals
                            </a>
                            <p aria-hidden="true" class="mt-1">Shop now</p>
                          </div>
                          <div class="group relative text-base sm:text-sm">
                            <div
                              class="aspect-h-1 aspect-w-1 overflow-hidden rounded-lg bg-gray-100 group-hover:opacity-75"
                            >
                              <img
                                src="https://tailwindui.com/plus/img/ecommerce-images/mega-menu-category-02.jpg"
                                alt="Close up of Basic Tee fall bundle with off-white, ochre, olive, and black tees."
                                class="object-cover object-center"
                              />
                            </div>
                            <a
                              href="#"
                              class="mt-6 block font-medium text-gray-900"
                            >
                              <span
                                class="absolute inset-0 z-10"
                                aria-hidden="true"
                              ></span>
                              Basic Tees
                            </a>
                            <p aria-hidden="true" class="mt-1">Shop now</p>
                          </div>
                        </div>
                        <div
                          class="row-start-1 grid grid-cols-3 gap-x-8 gap-y-10 text-sm"
                        >
                          <div *ngFor="let children of parentCategory.children">
                            <p
                              id="{{ children.name }}-heading"
                              class="font-medium text-gray-900"
                            >
                              {{ children.name }}
                            </p>
                            <ul class="mt-6 space-y-6 sm:mt-4 sm:space-y-4">
                              <li
                                class="flex"
                                *ngFor="
                                  let grandChildren of children | toIterable
                                "
                              >
                                <a href="#" class="hover:text-gray-800">{{
                                  grandChildren.name
                                }}</a>
                              </li>
                            </ul>
                          </div>
                          <div>
                            <p
                              id="Brands-heading"
                              class="font-medium text-gray-900"
                            >
                              Brands
                            </p>
                            <ul
                              aria-labelledby="Brands-heading"
                              class="mt-6 space-y-6 sm:mt-4 sm:space-y-4"
                            >
                              <li class="flex" *ngFor="let brand of brands">
                                <a href="#" class="hover:text-gray-800">{{
                                  brand
                                }}</a>
                              </li>
                            </ul>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <a
                [routerLink]="['/about-us']"
                class="flex items-center text-sm font-medium text-gray-700 hover:text-gray-800"
                >Company</a
              >
              <a
                [routerLink]="['/shop']"
                class="flex items-center text-sm font-medium text-gray-700 hover:text-gray-800"
                >Stores</a
              >
            </div>
          </div>

          <div class="ml-auto flex items-center">
            <div
              class="hidden lg:flex lg:flex-1 lg:items-center lg:justify-end lg:space-x-6"
              *ngIf="!isLoggedIn"
            >
              <a
                [routerLink]="['auth/signin']"
                class="text-sm font-medium text-gray-700 hover:text-gray-800"
                >Sign in</a
              >
              <span class="h-6 w-px bg-gray-200" aria-hidden="true"></span>
              <a
                [routerLink]="['auth/signup']"
                class="text-sm font-medium text-gray-700 hover:text-gray-800"
                >Create account</a
              >
            </div>
            <div class="flex -space-x-2 overflow-hidden" *ngIf="isLoggedIn">
              <img
                class="inline-block h-10 w-10 rounded-full ring-2 ring-white"
                src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?ixlib=rb-1.2.1&ixid=eyJhcHBfaWQiOjEyMDd9&auto=format&fit=facearea&facepad=2&w=256&h=256&q=80"
                alt=""
              />
            </div>

            <div class="hidden lg:ml-8 lg:flex">
              <a
                href="#"
                class="flex items-center text-gray-700 hover:text-gray-800"
              >
                <img
                  src="https://tailwindui.com/plus/img/flags/flag-united-states.svg"
                  alt=""
                  class="block h-auto w-5 flex-shrink-0"
                />
                <span class="ml-3 block text-sm font-medium">USD</span>
                <span class="sr-only">, change currency</span>
              </a>
            </div>

            <!-- Search -->
            <div class="flex lg:ml-6">
              <a href="#" class="p-2 text-gray-400 hover:text-gray-500">
                <span class="sr-only">Search</span>
                <app-icon
                  icon="magnifying-glass"
                  classNames="h-6 w-6"
                ></app-icon>
              </a>
            </div>

            <!-- Cart -->
            <div class="ml-4 flow-root lg:ml-6">
              <a
                (click)="updateDropCartSelection()"
                class="group -m-2 flex cursor-pointer items-center p-2"
              >
                <app-icon
                  icon="shopping-bag"
                  classNames="h-6 w-6 flex-shrink-0 text-gray-400 group-hover:text-gray-500"
                ></app-icon>

                <span
                  class="ml-2 text-sm font-medium text-gray-700 group-hover:text-gray-800"
                  >0</span
                >
                <span class="sr-only">items in cart, view bag</span>
              </a>
            </div>
            <app-dropcart [isDropCartOpened]="isDropCartOpened"></app-dropcart>
          </div>
        </div>
      </div>
    </nav>
  </header>
</div>
