<div class="mobile-menu relative z-50 lg:hidden" aria-modal="true" [class.pointer-events-none]="hideMobileMenu">
  <div class="fixed inset-0 bg-black bg-opacity-25" aria-hidden="true" (click)="hideMobileDrawer()" [ngClass]="
      hideMobileMenu
        ? 'opacity-0 transition-opacity duration-300 ease-linear'
        : 'opacity-100 transition-opacity duration-300 ease-linear'
    "></div>

  <div class="fixed inset-0 z-50 flex pointer-events-none">
    <div class="relative flex w-full max-w-xs flex-col overflow-y-auto bg-white pb-12 shadow-xl pointer-events-auto"
      [ngClass]="
        hideMobileMenu
          ? '-translate-x-full transform transition duration-300 ease-in-out'
          : 'translate-x-0 transform transition duration-300 ease-in-out'
      ">
      <div class="flex px-4 pb-2 pt-5">
        <button type="button" class="relative -m-2 inline-flex items-center justify-center rounded-md p-2 text-gray-400"
          (click)="hideMobileDrawer()">
          <span class="absolute -inset-0.5"></span>
          <span class="sr-only">Close menu</span>
          <app-icon icon="x-mark" classNames="h-6 w-6"></app-icon>
        </button>
      </div>

      <!-- Links -->
      <div class="mt-2">
        <div class="border-b border-gray-200">
          <div class="-mb-px flex space-x-8 px-4" aria-orientation="horizontal" role="tablist">
            <ng-container *ngFor="let parentCategory of categoryTree">
              <button id="tabs-1-{{ parentCategory.name }}"
                class="flex-1 whitespace-nowrap border-b-2 border-transparent px-1 py-4 text-base font-medium text-gray-900"
                aria-controls="tabs-1-panel-1" role="tab" type="button"
                [ngClass]="selectedMobileMenu === parentCategory.name ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-gray-900'"
                (click)="updateMobileMenuSelection(parentCategory.name)">{{ parentCategory.name }}</button>
            </ng-container>
          </div>
        </div>

        <ng-container *ngFor="let category of categoryTree">
          <div *ngIf="selectedMobileMenu === category.name" id="tabs-1-panel-1" class="space-y-10 px-4 pb-8 pt-10"
            role="tabpanel">
            <div class="grid grid-cols-2 gap-x-4">
              <div class="group relative text-sm">
                <div class="aspect-h-1 aspect-w-1 overflow-hidden rounded-lg bg-gray-100 group-hover:opacity-75">
                  <img *ngIf="category.name === 'Women'"
                    src="https://res.cloudinary.com/akazad13/image/upload/v1729420811/shopizy/soy4l9t0xba9dz2aq3li.jpg"
                    alt="New arrivals for women" class="object-cover object-center" />
                  <img *ngIf="category.name === 'Men'"
                    src="https://res.cloudinary.com/akazad13/image/upload/v1729420811/shopizy/soy4l9t0xba9dz2aq3li.jpg"
                    alt="Models sitting back to back, wearing Basic Tee in black and bone."
                    class="object-cover object-center" />
                </div>
                <a [routerLink]="['/shop']" class="mt-6 block font-medium text-gray-900"><span
                    class="absolute inset-0 z-10" aria-hidden="true"></span>New Arrivals</a>
                <p aria-hidden="true" class="mt-1">Shop now</p>
              </div>
              <div class="group relative text-sm">
                <div class="aspect-h-1 aspect-w-1 overflow-hidden rounded-lg bg-gray-100 group-hover:opacity-75">
                  <img
                    src="https://res.cloudinary.com/akazad13/image/upload/v1729420811/shopizy/soy4l9t0xba9dz2aq3li.jpg"
                    alt="Basic Tee collection" class="object-cover object-center" />
                </div>
                <a [routerLink]="['/shop']" class="mt-6 block font-medium text-gray-900"><span
                    class="absolute inset-0 z-10" aria-hidden="true"></span>Basic Tees</a>
                <p aria-hidden="true" class="mt-1">Shop now</p>
              </div>
            </div>
            <ng-container *ngFor="let childCategory of category.children">
              <div>
                <p id="women-clothing-heading-mobile" class="font-medium text-gray-900">{{ childCategory.name }}</p>
                <ul aria-labelledby="women-clothing-heading-mobile" class="mt-6 flex flex-col space-y-6">
                  <ng-container *ngFor="let grandChildCategory of (childCategory | toIterable | slice:0:2)">
                    <li class="flow-root"><a [routerLink]="['/shop']" class="-m-2 block p-2 text-gray-500">{{
                        grandChildCategory.name }}</a></li>
                  </ng-container>
                  <li class="flow-root"><a [routerLink]="['/shop']" class="-m-2 block p-2 text-gray-500">Browse
                      All</a></li>
                </ul>
              </div>
            </ng-container>
            <div>
              <p id="women-brands-heading-mobile" class="font-medium text-gray-900">Brands</p>
              <ul aria-labelledby="women-brands-heading-mobile" class="mt-6 flex flex-col space-y-6">
                <ng-container *ngFor="let brand of (brands.slice(0,2) || [])">
                  <li class="flow-root"><a [routerLink]="['/shop']" class="-m-2 block p-2 text-gray-500">{{ brand
                      }}</a></li>
                </ng-container>
                <li class="flow-root"><a [routerLink]="['/shop']" class="-m-2 block p-2 text-gray-500">Browse
                    All</a>
                </li>
              </ul>
            </div>
          </div>
        </ng-container>
      </div>

      <div class="space-y-6 border-t border-gray-200 px-4 py-6">
        <div class="flow-root">
          <a [routerLink]="['/shop']" (click)="hideMobileDrawer()" class="-m-2 block p-2 font-medium text-gray-900">Shop</a>
        </div>
        <div *ngIf="isAdmin" class="flow-root">
          <a [routerLink]="['/admin']" (click)="hideMobileDrawer()" class="-m-2 block p-2 font-bold text-indigo-600">Admin Panel</a>
        </div>
      </div>

      <div class="space-y-6 border-t border-gray-200 px-4 py-6">
        <div class="flow-root">
          <a [routerLink]="['auth/signin']" class="-m-2 block p-2 font-medium text-gray-900">Sign in</a>
        </div>
        <div class="flow-root">
          <a [routerLink]="['auth/signup']" class="-m-2 block p-2 font-medium text-gray-900">Create account</a>
        </div>
      </div>

      <div class="border-t border-gray-200 px-4 py-6">
        <span class="-m-2 flex items-center p-2">
          <span class="block text-base font-medium text-gray-900">USD</span>
        </span>
      </div>
    </div>
  </div>
</div>
