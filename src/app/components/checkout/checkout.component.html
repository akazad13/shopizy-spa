<section class="bg-white">
  <div class="container mx-auto px-6 py-10">
    <div
      class="mt-8 grid grid-cols-1 gap-8 sm:grid-cols-2 lg:grid-cols-2 xl:mt-12 xl:gap-12"
    >
      <div class="w-full">
        <form>
          <div class="space-y-12">
            <div class="border-b border-gray-900/10 pb-12">
              <h2 class="text-base font-semibold leading-7 text-gray-700">
                Contact Information
              </h2>

              <div class="">
                <label
                  for="email"
                  class="block text-sm font-medium leading-6 text-gray-700"
                  >Email address</label
                >
                <div class="mt-2">
                  <input
                    type="email"
                    name="email"
                    id="email"
                    autocomplete="email"
                    class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                  />
                </div>
              </div>

              <hr class="my-5 h-px border-t-0 bg-gray-200" />

              <h2 class="text-base font-semibold leading-7 text-gray-700">
                Payment
              </h2>

              <div class="mb-3 grid grid-cols-2 gap-4">
                <div class="col-span-2 sm:col-span-1">
                  <label
                    for="full_name"
                    class="mb-2 block text-sm font-medium text-gray-700"
                  >
                    Card Name*
                  </label>
                  <input
                    type="text"
                    id="full_name"
                    class="focus:border-primary-500 focus:ring-primary-500 dark:focus:border-primary-500 dark:focus:ring-primary-500 block w-full rounded-lg border border-gray-300 p-2.5 text-sm text-gray-900"
                    placeholder="Bonnie Green"
                    required
                  />
                </div>

                <div class="col-span-2 sm:col-span-1">
                  <label
                    for="card-number-input"
                    class="mb-2 block text-sm font-medium text-gray-700"
                  >
                    Card number*
                  </label>
                  <input
                    type="text"
                    id="card-number-input"
                    class="focus:border-primary-500 focus:ring-primary-500 dark:focus:border-primary-500 dark:focus:ring-primary-500 block w-full rounded-lg border border-gray-300 p-2.5 pe-10 text-sm text-gray-900"
                    placeholder="xxxx-xxxx-xxxx-xxxx"
                    pattern="^4[0-9]{12}(?:[0-9]{3})?$"
                    required
                  />
                </div>

                <div>
                  <label
                    for="card-expiration-input"
                    class="mb-2 block text-sm font-medium text-gray-700"
                    >Card expiration*
                  </label>
                  <div class="relative">
                    <div
                      class="pointer-events-none absolute inset-y-0 start-0 flex items-center ps-3.5"
                    >
                      <app-icon
                        icon="calendar"
                        classNames="h-5 w-4 text-gray-300"
                      ></app-icon>
                    </div>
                    <input
                      datepicker
                      datepicker-format="mm/yy"
                      id="card-expiration-input"
                      type="text"
                      class="block w-full rounded-lg border border-gray-300 p-2.5 ps-9 text-sm text-gray-900 focus:border-blue-500 focus:ring-blue-500"
                      placeholder="12/23"
                      required
                    />
                  </div>
                </div>
                <div>
                  <label
                    for="cvv-input"
                    class="mb-2 flex items-center gap-1 text-sm font-medium text-gray-700"
                  >
                    CVV*
                    <button
                      data-tooltip-target="cvv-desc"
                      data-tooltip-trigger="hover"
                      class="text-gray-400 hover:text-gray-900 dark:text-gray-500"
                    >
                      <app-icon
                        icon="info"
                        classNames="h-5 w-4 text-gray-300 hover:text-gray-600"
                      ></app-icon>
                    </button>
                    <div
                      id="cvv-desc"
                      role="tooltip"
                      class="tooltip invisible absolute z-10 inline-block rounded-lg bg-gray-900 px-3 py-2 text-sm font-medium text-white opacity-0 shadow-sm transition-opacity duration-300 dark:bg-gray-700"
                    >
                      The last 3 digits on back of card
                      <div class="tooltip-arrow" data-popper-arrow></div>
                    </div>
                  </label>
                  <input
                    type="number"
                    id="cvv-input"
                    aria-describedby="helper-text-explanation"
                    class="focus:border-primary-500 focus:ring-primary-500 block w-full rounded-lg border border-gray-300 p-2.5 text-sm text-gray-900"
                    placeholder="•••"
                    required
                  />
                </div>
              </div>

              <hr class="my-5 h-px border-t-0 bg-gray-200" />

              <h2 class="text-base font-semibold leading-7 text-gray-700">
                Shipping information
              </h2>

              <div class="mt-2 grid grid-cols-1 gap-x-6 gap-y-3 sm:grid-cols-6">
                <div class="sm:col-span-3">
                  <label
                    for="first-name"
                    class="block text-sm font-medium leading-6 text-gray-700"
                    >First name</label
                  >
                  <div class="mt-2">
                    <input
                      type="text"
                      name="first-name"
                      id="first-name"
                      autocomplete="given-name"
                      class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                    />
                  </div>
                </div>

                <div class="sm:col-span-3">
                  <label
                    for="last-name"
                    class="block text-sm font-medium leading-6 text-gray-700"
                    >Last name</label
                  >
                  <div class="mt-2">
                    <input
                      type="text"
                      name="last-name"
                      id="last-name"
                      autocomplete="family-name"
                      class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                    />
                  </div>
                </div>

                <div class="sm:col-span-6">
                  <label
                    for="address"
                    class="block text-sm font-medium leading-6 text-gray-700"
                    >Address</label
                  >
                  <div class="mt-2">
                    <input
                      id="address"
                      name="address"
                      type="text"
                      class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                    />
                  </div>
                </div>

                <div class="sm:col-span-3">
                  <label
                    for="city"
                    class="block text-sm font-medium leading-6 text-gray-700"
                    >City</label
                  >
                  <div class="mt-2">
                    <input
                      id="city"
                      name="city"
                      type="text"
                      class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                    />
                  </div>
                </div>
                <div class="sm:col-span-3">
                  <label
                    for="country"
                    class="block text-sm font-medium leading-6 text-gray-700"
                    >Country</label
                  >
                  <div class="mt-2">
                    <select
                      id="country"
                      name="country"
                      autocomplete="country-name"
                      class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:max-w-xs sm:text-sm sm:leading-6"
                    >
                      <option>United States</option>
                      <option>Canada</option>
                      <option>Mexico</option>
                    </select>
                  </div>
                </div>

                <div class="sm:col-span-3">
                  <label
                    for="region"
                    class="block text-sm font-medium leading-6 text-gray-700"
                    >State / Province</label
                  >
                  <div class="mt-2">
                    <input
                      type="text"
                      name="region"
                      id="region"
                      autocomplete="address-level1"
                      class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                    />
                  </div>
                </div>

                <div class="sm:col-span-3">
                  <label
                    for="postal-code"
                    class="block text-sm font-medium leading-6 text-gray-700"
                    >ZIP / Postal code</label
                  >
                  <div class="mt-2">
                    <input
                      type="text"
                      name="postal-code"
                      id="postal-code"
                      autocomplete="postal-code"
                      class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                    />
                  </div>
                </div>
                <div class="col-span-full">
                  <label
                    for="phone"
                    class="block text-sm font-medium leading-6 text-gray-700"
                    >Phone</label
                  >
                  <div class="mt-2">
                    <input
                      type="text"
                      name="phone"
                      id="phone"
                      class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                    />
                  </div>
                </div>
              </div>

              <div class="justify- flex items-center py-5">
                <div class="grid w-full gap-2 sm:w-full lg:grid-cols-2">
                  <div class="relative">
                    <input
                      class="peer hidden"
                      id="radio_1"
                      type="radio"
                      name="radio"
                      checked
                    />
                    <span
                      class="absolute right-4 top-1/2 box-content block h-3 w-3 -translate-y-1/2 rounded-full border-8 border-gray-300 bg-white peer-checked:border-indigo-500"
                    ></span>
                    <label
                      class="flex cursor-pointer flex-col rounded-lg border border-gray-300 p-4 peer-checked:border-2 peer-checked:border-indigo-700"
                      for="radio_1"
                    >
                      <span class="text-l">Standard</span>
                      <span class="mt-1 text-sm text-gray-500"
                        >4–10 business days</span
                      >
                      <span class="mt-3 text-sm"> $5.00 </span>
                    </label>
                  </div>
                  <div class="relative">
                    <input
                      class="peer hidden"
                      id="radio_2"
                      type="radio"
                      name="radio"
                    />
                    <span
                      class="absolute right-4 top-1/2 box-content block h-3 w-3 -translate-y-1/2 rounded-full border-8 border-gray-300 bg-white peer-checked:border-indigo-500"
                    ></span>

                    <label
                      class="flex cursor-pointer flex-col rounded-lg border border-gray-300 p-4 peer-checked:border-2 peer-checked:border-indigo-700"
                      for="radio_2"
                    >
                      <span class="text-l">Express</span>
                      <span class="mt-1 text-sm text-gray-500"
                        >2–5business days</span
                      >
                      <span class="mt-3 text-sm"> $10.00 </span>
                    </label>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>

      <div class="w-full">
        <div class="mt-8">
          <div class="flow-root">
            <ul class="-my-6 divide-y divide-gray-200">
              <li class="flex py-6" *ngFor="let item of cartService.cartItems">
                <div
                  class="h-24 w-24 flex-shrink-0 rounded-md border border-gray-200"
                >
                  <img
                    src="{{ item.image }}"
                    alt=""
                    class="h-full w-full object-cover object-center"
                  />
                </div>

                <div class="ml-4 flex flex-1 flex-col">
                  <div>
                    <div
                      class="flex justify-between text-base font-medium text-gray-900"
                    >
                      <h3>
                        <a href="#">{{ item.name }}</a>
                      </h3>
                      <p class="ml-4">${{ item.price }}</p>
                    </div>
                    <p class="mt-1 text-sm text-gray-500">{{ item.color }}</p>
                  </div>
                  <div class="flex flex-1 items-end justify-between text-sm">
                    <p class="text-gray-500">Qty {{ item.quantity }}</p>

                    <div class="flex">
                      <button
                        type="button"
                        class="font-medium text-indigo-600 hover:text-indigo-500"
                      >
                        Remove
                      </button>
                    </div>
                  </div>
                </div>
              </li>

              <!-- More products... -->
            </ul>
          </div>
        </div>

        <div class="border-t border-gray-200 px-4 py-6 sm:px-6">
          <div class="flex justify-between text-base font-medium text-gray-900">
            <p>Subtotal</p>
            <p>${{ cartService.subTotal }}</p>
          </div>
          <p class="mt-0.5 text-sm text-gray-500">
            Shipping and taxes calculated at checkout.
          </p>
          <div class="mt-6">
            <a
              class="flex items-center justify-center rounded-md border border-transparent bg-indigo-600 px-6 py-3 text-base font-medium text-white shadow-sm hover:bg-indigo-700"
              >Checkout</a
            >
          </div>
          <div
            class="mt-6 flex justify-center text-center text-sm text-gray-500"
          >
            <p>
              or
              <button
                type="button"
                class="font-medium text-indigo-600 hover:text-indigo-500"
                [routerLink]="['/', 'shop']"
              >
                Continue Shopping
                <span aria-hidden="true"> &rarr;</span>
              </button>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
