<!-- Table Skeleton -->
<div *ngIf="type === 'table'" class="space-y-3 p-6">
  <div class="space-y-3">
    <div class="flex gap-4">
      <div *ngFor="let col of colsArray" class="flex-1">
        <div class="h-4 bg-gradient-to-r from-slate-200 to-slate-100 rounded-lg animate-pulse"></div>
      </div>
    </div>
  </div>
  
  <div *ngFor="let row of rowsArray" class="space-y-2">
    <div class="flex gap-4">
      <div *ngFor="let col of colsArray" class="flex-1">
        <div class="h-10 bg-gradient-to-r from-slate-100 to-slate-50 rounded-lg animate-pulse"></div>
      </div>
    </div>
  </div>
</div>

<!-- Card Skeleton -->
<div *ngIf="type === 'card'" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-{{ columns }} gap-4 p-6">
  <div *ngFor="let i of rowsArray" class="space-y-4 p-4 border border-slate-200 rounded-2xl bg-slate-50">
    <div class="h-4 bg-gradient-to-r from-slate-200 to-slate-100 rounded-lg animate-pulse w-3/4"></div>
    <div class="space-y-2">
      <div class="h-3 bg-gradient-to-r from-slate-100 to-slate-50 rounded-lg animate-pulse"></div>
      <div class="h-3 bg-gradient-to-r from-slate-100 to-slate-50 rounded-lg animate-pulse w-5/6"></div>
    </div>
    <div class="h-8 bg-gradient-to-r from-slate-100 to-slate-50 rounded-lg animate-pulse w-1/3 mt-4"></div>
  </div>
</div>

<!-- Form Skeleton -->
<div *ngIf="type === 'form'" class="space-y-6 p-6">
  <div *ngFor="let row of rowsArray" class="space-y-3">
    <div class="h-4 bg-gradient-to-r from-slate-200 to-slate-100 rounded-lg animate-pulse w-1/4"></div>
    <div class="h-10 bg-gradient-to-r from-slate-100 to-slate-50 rounded-lg animate-pulse"></div>
  </div>
  <div class="flex gap-3 pt-4">
    <div class="h-10 bg-gradient-to-r from-slate-200 to-slate-100 rounded-lg animate-pulse flex-1 max-w-xs"></div>
    <div class="h-10 bg-gradient-to-r from-slate-100 to-slate-50 rounded-lg animate-pulse flex-1 max-w-xs"></div>
  </div>
</div>

<!-- List Skeleton -->
<div *ngIf="type === 'list'" class="space-y-3 p-6">
  <div *ngFor="let row of rowsArray" class="flex items-center gap-3 p-3 rounded-lg bg-slate-50">
    <div class="w-6 h-6 bg-gradient-to-r from-slate-200 to-slate-100 rounded-lg animate-pulse flex-shrink-0"></div>
    <div class="flex-1 space-y-2">
      <div class="h-4 bg-gradient-to-r from-slate-200 to-slate-100 rounded-lg animate-pulse"></div>
      <div class="h-3 bg-gradient-to-r from-slate-100 to-slate-50 rounded-lg animate-pulse w-3/4"></div>
    </div>
    <div class="flex gap-2">
      <div class="h-8 w-16 bg-gradient-to-r from-slate-100 to-slate-50 rounded-lg animate-pulse"></div>
      <div class="h-8 w-16 bg-gradient-to-r from-slate-100 to-slate-50 rounded-lg animate-pulse"></div>
    </div>
  </div>
</div>
