<div class="fixed right-4 top-24 z-[9999] flex flex-col gap-y-3">
  <div *ngFor="let toast of toasts$ | async" 
    class="toast-enter flex w-80 items-center gap-x-3 rounded-2xl border p-4 shadow-xl backdrop-blur-md"
    [ngClass]="getClasses(toast.type)">
    
    <div class="flex-shrink-0">
      <app-icon [icon]="getIcon(toast.type)" classNames="h-6 w-6"></app-icon>
    </div>

    <div class="flex-1 text-sm font-medium">
      {{ toast.message }}
    </div>

    <button (click)="remove(toast.id)" class="ml-auto text-gray-400 hover:text-gray-600">
      <app-icon icon="x-mark" classNames="h-4 w-4"></app-icon>
    </button>
  </div>
</div>
