<section class="bg-white py-14 sm:py-16">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">

    <!-- Section header -->
    <div class="flex items-end justify-between">
      <div>
        <p class="text-xs font-semibold uppercase tracking-wider text-indigo-500">Trending Now</p>
        <h2 class="mt-1 text-2xl font-bold tracking-tight text-gray-900 sm:text-3xl">New Hot Products</h2>
      </div>
      <a [routerLink]="['/shop']"
        class="hidden items-center gap-x-1 text-sm font-medium text-indigo-600 hover:text-indigo-700 sm:flex">
        Shop all
        <app-icon icon="chevron-right" classNames="h-4 w-4"></app-icon>
      </a>
    </div>

    <!-- Image mosaic -->
    <div class="mt-8 grid grid-cols-1 gap-5 lg:grid-cols-3">
      <!-- Large featured -->
      <div class="group col-span-2 overflow-hidden rounded-2xl shadow-sm" style="aspect-ratio: 9/9;">
        <img [src]="imageUrls[0]" alt="Featured product"
          class="h-full w-full object-cover object-center transition-transform duration-500 group-hover:scale-105" />
      </div>
      <!-- Small stacked -->
      <div class="grid grid-rows-2 gap-5">
        <div class="group overflow-hidden rounded-2xl shadow-sm">
          <img [src]="imageUrls[1]" alt="Product"
            class="h-full w-full object-cover object-center transition-transform duration-500 group-hover:scale-105" />
        </div>
        <div class="group overflow-hidden rounded-2xl shadow-sm">
          <img [src]="imageUrls[2]" alt="Product"
            class="h-full w-full object-cover object-center transition-transform duration-500 group-hover:scale-105" />
        </div>
      </div>
    </div>

  </div>
</section>
