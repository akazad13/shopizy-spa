<section class="my-12 px-4 sm:px-6 lg:px-8">
  <div class="mx-auto max-w-7xl">
    <div
      class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-indigo-600 via-indigo-700 to-purple-700 shadow-xl">

      <!-- Background pattern -->
      <div class="pointer-events-none absolute inset-0 overflow-hidden" aria-hidden="true">
        <div class="absolute -right-20 -top-20 h-64 w-64 rounded-full bg-white/5"></div>
        <div class="absolute -bottom-12 -left-12 h-52 w-52 rounded-full bg-white/5"></div>
        <div class="absolute right-1/4 top-1/2 h-32 w-32 -translate-y-1/2 rounded-full bg-white/5"></div>
      </div>

      <div
        class="relative flex flex-col items-start justify-between gap-8 px-8 py-12 sm:px-12 lg:flex-row lg:items-center">
        <div>
          <span
            class="inline-flex items-center rounded-full bg-white/15 px-3 py-1 text-xs font-semibold text-indigo-100 ring-1 ring-white/20">
            ⚡ Limited Time Offer
          </span>
          <h2 class="mt-3 text-3xl font-bold tracking-tight text-white sm:text-4xl">
            Summer Sale is Here
          </h2>
          <p class="mt-3 max-w-xl text-base text-indigo-200">
            Get up to <span class="font-bold text-white">50% off</span> on selected items.
            Free shipping on all orders over $100. Don't miss out!
          </p>
          <div class="mt-5 flex flex-wrap gap-4 text-sm text-indigo-200">
            <span class="flex items-center gap-x-1.5">
              <app-icon icon="check-solid" classNames="h-4 w-4 text-indigo-300"></app-icon>
              Up to 50% off
            </span>
            <span class="flex items-center gap-x-1.5">
              <app-icon icon="check-solid" classNames="h-4 w-4 text-indigo-300"></app-icon>
              Free shipping included
            </span>
            <span class="flex items-center gap-x-1.5">
              <app-icon icon="check-solid" classNames="h-4 w-4 text-indigo-300"></app-icon>
              Limited stock
            </span>
          </div>
        </div>
        <div class="flex-shrink-0">
          <a [routerLink]="['/shop']"
            class="inline-flex items-center gap-x-2 rounded-xl bg-white px-6 py-3 text-sm font-bold text-indigo-700 shadow-lg transition hover:bg-indigo-50 active:scale-95">
            Shop Now
            <app-icon icon="arrow-right-solid" classNames="h-4 w-4"></app-icon>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
