<section class="my-12">
  <div class="relative overflow-hidden rounded-lg bg-indigo-600">
    <div class="px-6 py-12 sm:px-12 sm:py-16 lg:flex lg:items-center lg:py-20">
      <div class="lg:w-0 lg:flex-1">
        <h2 class="text-3xl font-bold tracking-tight text-white sm:text-4xl">
          Summer Sale is Here
        </h2>
        <p class="mt-4 max-w-xl text-lg text-indigo-100">
          Get up to 50% off on selected items. Free shipping on orders over $100.
        </p>
      </div>
      <div class="mt-8 lg:ml-8 lg:mt-0 lg:flex-shrink-0">
        <a
          [routerLink]="['/shop']"
          class="inline-flex items-center rounded-md border border-transparent bg-white px-6 py-3 text-base font-medium text-indigo-600 shadow-sm hover:bg-indigo-50"
        >
          Shop Now
        </a>
      </div>
    </div>
  </div>
</section>
