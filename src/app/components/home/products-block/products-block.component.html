<section class="bg-white py-12 sm:py-14">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">

    <!-- Section header -->
    <div *ngIf="column?.title" class="mb-8 flex items-end justify-between">
      <div>
        <h2 class="text-2xl font-bold tracking-tight text-gray-900 sm:text-3xl">{{ column?.title }}</h2>
      </div>
      <a [routerLink]="['/shop']"
        class="hidden items-center gap-x-1 text-sm font-medium text-indigo-600 hover:text-indigo-700 sm:flex">
        View all
        <app-icon icon="chevron-right" classNames="h-4 w-4"></app-icon>
      </a>
    </div>

    <!-- Product grid -->
    <div *ngIf="loading" class="rounded-2xl border border-gray-100 bg-white shadow-sm">
      <app-skeleton-loader type="card" [rows]="1" [columns]="5"></app-skeleton-loader>
    </div>

    <div *ngIf="!loading" class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5">
      <ng-container *ngFor="let product of column?.products ?? []">
        <app-product-card [product]="product"></app-product-card>
      </ng-container>
    </div>

  </div>
</section>
