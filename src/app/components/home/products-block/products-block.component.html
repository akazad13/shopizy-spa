<div class="bg-white">
  <div class="mx-auto max-w-2xl px-4 py-8 sm:px-6 sm:py-8 lg:max-w-7xl lg:px-8">
    <h2 class="text-center text-4xl font-bold tracking-tight text-gray-900">
      {{ column?.title }}
    </h2>

    <div
      class="mt-10 grid grid-cols-1 gap-x-5 gap-y-10 sm:grid-cols-2 lg:grid-cols-5 xl:gap-x-8"
      >
      @for (product of column?.products; track product) {
        <div class="group relative">
          <app-product-card [product]="product"></app-product-card>
        </div>
      }
    </div>
  </div>
</div>
