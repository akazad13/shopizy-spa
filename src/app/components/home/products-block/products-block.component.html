<section class="bg-white py-12 sm:py-14">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">

    <!-- Section header -->
    <div *ngIf="column?.title" class="mb-8 flex items-end justify-between">
      <div>
        <h2 class="text-2xl font-bold tracking-tight text-gray-900 sm:text-3xl">{{ column?.title }}</h2>
      </div>
      <a [routerLink]="['/shop']"
        class="hidden items-center gap-x-1 text-sm font-medium text-indigo-600 hover:text-indigo-700 sm:flex">
        View all
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="h-4 w-4">
          <path fill-rule="evenodd"
            d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z"
            clip-rule="evenodd" />
        </svg>
      </a>
    </div>

    <!-- Product grid -->
    <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5">
      <ng-container *ngFor="let product of column?.products ?? []">
        <app-product-card [product]="product"></app-product-card>
      </ng-container>
    </div>

  </div>
</section>
