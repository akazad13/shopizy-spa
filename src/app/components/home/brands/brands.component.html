<div class="bg-white py-16 sm:py-16">
  <div class="mx-auto max-w-7xl px-6 lg:px-8">
    <h2 class="text-center text-4xl font-semibold leading-8 text-gray-900">
      We have the world’s toppest brands
    </h2>
    <div
      class="mx-auto mt-12 grid max-w-lg grid-cols-4 items-center gap-x-2 gap-y-2 sm:max-w-xl sm:grid-cols-6 sm:gap-x-2 lg:mx-0 lg:max-w-none lg:grid-cols-5"
    >
      <div
        *ngFor="let imageUrl of imageUrls"
        class="col-span-2 h-16 border-2 border-gray-200 lg:col-span-1"
      >
        <img
          class="max-h-16 w-full object-contain p-2"
          src="{{ imageUrl }}"
          alt="Transistor"
        />
      </div>
    </div>
  </div>
</div>
