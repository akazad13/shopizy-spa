<section class="bg-gray-50 py-14 sm:py-16">
  <div class="mx-auto max-w-7xl px-6 lg:px-8">
    <!-- Section header -->
    <div class="text-center">
      <p class="text-xs font-semibold uppercase tracking-wider text-indigo-500">
        Trusted Partners
      </p>
      <h2 class="mt-2 text-2xl font-bold text-gray-900 sm:text-3xl">
        Brands we carry
      </h2>
      <p class="mx-auto mt-3 max-w-md text-sm text-gray-500">
        We partner with the world's leading fashion brands to bring you only the
        best.
      </p>
    </div>

    <!-- Brand logo grid -->
    <div class="mt-10 grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-5">
      <ng-container *ngFor="let brand of brands">
        <div
          class="flex items-center justify-center rounded-2xl border border-gray-200 bg-white p-4 shadow-sm transition hover:border-indigo-200 hover:shadow-md"
        >
          <img
            class="max-h-10 w-full object-contain grayscale transition-all duration-300 hover:grayscale-0"
            [src]="brand.logoUrl"
            [alt]="brand.name"
          />
        </div>
      </ng-container>
    </div>
  </div>
</section>
