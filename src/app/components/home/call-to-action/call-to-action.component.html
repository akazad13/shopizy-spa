<!-- Hero / Call to Action -->
<section class="relative overflow-hidden bg-white">

  <!-- Background decorative blobs -->
  <div class="pointer-events-none absolute inset-x-0 -top-20 -z-10 overflow-hidden" aria-hidden="true">
    <div class="absolute left-1/2 top-0 -translate-x-1/2 opacity-20 blur-3xl">
      <div class="aspect-square h-[40rem] rounded-full bg-gradient-to-tr from-indigo-400 to-purple-400"></div>
    </div>
  </div>

  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="grid min-h-[80vh] grid-cols-1 items-center gap-16 lg:grid-cols-2">

      <!-- Text content -->
      <div class="relative z-10 pb-12 lg:pb-0">
        <span
          class="inline-flex items-center gap-x-2 rounded-full bg-indigo-50 px-3.5 py-1.5 text-xs font-semibold text-indigo-700 ring-1 ring-indigo-100">
          <span class="h-1.5 w-1.5 rounded-full bg-indigo-500"></span>
          New Season Drop
        </span>
        <h1 class="mt-5 text-5xl font-bold tracking-tight text-gray-900 sm:text-6xl lg:text-7xl">
          Summer styles<br />
          <span class="text-indigo-600">are here</span>
        </h1>
        <p class="mt-6 max-w-md text-lg leading-relaxed text-gray-500">
          Explore our fresh summer collection — designed to keep you cool, stylish, and ready for anything the season
          throws at you.
        </p>
        <div class="mt-8 flex flex-wrap gap-4">
          <a [routerLink]="['/', 'shop']"
            class="inline-flex items-center gap-x-2 rounded-xl bg-indigo-600 px-6 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-700 active:scale-95">
            Shop the Collection
            <app-icon icon="chevron-right" classNames="h-4 w-4"></app-icon>
          </a>
          <a [routerLink]="['/', 'shop']"
            class="inline-flex items-center gap-x-2 rounded-xl border border-gray-200 bg-white px-6 py-3 text-sm font-semibold text-gray-700 shadow-sm transition hover:bg-gray-50">
            Browse All
          </a>
        </div>
        <!-- Trust indicators -->
        <div class="mt-10 flex flex-wrap items-center gap-x-8 gap-y-3 text-xs text-gray-400">
          <span class="flex items-center gap-x-1.5">
            <app-icon icon="check-solid" classNames="h-4 w-4 text-green-500"></app-icon>
            Free shipping over $100
          </span>
          <span class="flex items-center gap-x-1.5">
            <app-icon icon="check-solid" classNames="h-4 w-4 text-green-500"></app-icon>
            30-day easy returns
          </span>
          <span class="flex items-center gap-x-1.5">
            <app-icon icon="check-solid" classNames="h-4 w-4 text-green-500"></app-icon>
            100% authentic products
          </span>
        </div>
      </div>

      <!-- Decorative image mosaic -->
      <div class="relative hidden lg:block" aria-hidden="true">
        <div class="flex items-center gap-4">
          <div class="flex flex-col gap-4">
            <div class="h-52 w-40 overflow-hidden rounded-2xl shadow-lg">
              <img [src]="imageUrls[0]" alt="" class="h-full w-full object-cover" />
            </div>
            <div class="h-52 w-40 overflow-hidden rounded-2xl shadow-lg">
              <img [src]="imageUrls[1]" alt="" class="h-full w-full object-cover" />
            </div>
          </div>
          <div class="flex flex-col gap-4 -mt-10">
            <div class="h-52 w-40 overflow-hidden rounded-2xl shadow-lg">
              <img [src]="imageUrls[2]" alt="" class="h-full w-full object-cover" />
            </div>
            <div class="h-52 w-40 overflow-hidden rounded-2xl shadow-lg">
              <img [src]="imageUrls[3]" alt="" class="h-full w-full object-cover" />
            </div>
            <div class="h-52 w-40 overflow-hidden rounded-2xl shadow-lg">
              <img [src]="imageUrls[4]" alt="" class="h-full w-full object-cover" />
            </div>
          </div>
          <div class="flex flex-col gap-4">
            <div class="h-52 w-40 overflow-hidden rounded-2xl shadow-lg">
              <img [src]="imageUrls[5]" alt="" class="h-full w-full object-cover" />
            </div>
            <div class="h-52 w-40 overflow-hidden rounded-2xl shadow-lg">
              <img [src]="imageUrls[6]" alt="" class="h-full w-full object-cover" />
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
