<div *ngIf="isOpened" class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm" (click)="onClose()"></div>
  <div class="relative w-full max-w-lg transform overflow-hidden rounded-2xl bg-white p-8 shadow-2xl transition-all">
    <button (click)="onClose()" class="absolute right-4 top-4 text-gray-400 hover:text-gray-600">
      <app-icon icon="x-mark" classNames="h-6 w-6"></app-icon>
    </button>

    <h3 class="mb-6 text-2xl font-bold text-gray-900">{{ address ? 'Edit' : 'Add' }} Address</h3>

    <form [formGroup]="addressForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-gray-700">Label (e.g. Home, Office)</label>
        <input type="text" formControlName="label" 
          class="mt-1 block w-full rounded-xl border-gray-200 px-4 py-3 text-sm focus:border-indigo-500 focus:ring-indigo-500" 
          [class.border-red-500]="formData['label'] | isInvalid" placeholder="Home">
        <p *ngIf="formData['label'] | hasError:'required'" class="mt-1 text-xs text-red-500">Label is required</p>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700">Street Address</label>
        <input type="text" formControlName="street" 
          class="mt-1 block w-full rounded-xl border-gray-200 px-4 py-3 text-sm focus:border-indigo-500 focus:ring-indigo-500" 
          [class.border-red-500]="formData['street'] | isInvalid" placeholder="123 Street name">
        <p *ngIf="formData['street'] | hasError:'required'" class="mt-1 text-xs text-red-500">Street is required</p>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700">City</label>
          <input type="text" formControlName="city" 
            class="mt-1 block w-full rounded-xl border-gray-200 px-4 py-3 text-sm focus:border-indigo-500 focus:ring-indigo-500"
            [class.border-red-500]="formData['city'] | isInvalid">
          <p *ngIf="formData['city'] | hasError:'required'" class="mt-1 text-xs text-red-500">City is required</p>
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700">State / Province</label>
          <input type="text" formControlName="state" 
            class="mt-1 block w-full rounded-xl border-gray-200 px-4 py-3 text-sm focus:border-indigo-500 focus:ring-indigo-500"
            [class.border-red-500]="formData['state'] | isInvalid">
          <p *ngIf="formData['state'] | hasError:'required'" class="mt-1 text-xs text-red-500">State is required</p>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700">ZIP / Postal Code</label>
          <input type="text" formControlName="zipCode" 
            class="mt-1 block w-full rounded-xl border-gray-200 px-4 py-3 text-sm focus:border-indigo-500 focus:ring-indigo-500"
            [class.border-red-500]="formData['zipCode'] | isInvalid">
          <p *ngIf="formData['zipCode'] | hasError:'required'" class="mt-1 text-xs text-red-500">Zip Code is required</p>
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700">Country</label>
          <select formControlName="country" class="mt-1 block w-full rounded-xl border-gray-200 px-4 py-3 text-sm focus:border-indigo-500 focus:ring-indigo-500">
            <option value="US">United States</option>
            <option value="BD">Bangladesh</option>
            <option value="UK">United Kingdom</option>
          </select>
        </div>
      </div>

      <div class="flex items-center gap-x-2">
        <input type="checkbox" formControlName="isDefault" class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500">
        <label class="text-sm font-medium text-gray-700">Set as default address</label>
      </div>

      <div class="mt-8 flex gap-3">
        <button type="button" (click)="onClose()" class="flex-1 rounded-xl border border-gray-200 px-6 py-3 text-sm font-bold text-gray-700 hover:bg-gray-50">Cancel</button>
        <button type="submit" class="flex-1 rounded-xl bg-indigo-600 px-6 py-3 text-sm font-bold text-white shadow-lg hover:bg-indigo-700 active:scale-95">Save Address</button>
      </div>
    </form>
  </div>
</div>
