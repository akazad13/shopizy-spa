<div class="space-y-6">
  <div class="flex items-center justify-between border-b border-gray-100 pb-5">
    <h3 class="text-xl font-bold text-gray-900">Address Management</h3>
    <button (click)="openAddModal()"
      class="inline-flex items-center gap-x-2 rounded-xl bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-700 active:scale-95">
      <app-icon icon="plus" classNames="h-4 w-4"></app-icon>
      Add Address
    </button>
  </div>

  <div class="grid gap-4 sm:grid-cols-2">
    <div *ngFor="let addr of addresses$ | async" 
      class="group relative flex flex-col rounded-2xl border bg-white p-5 transition-all duration-200 hover:shadow-md"
      [class.border-indigo-600]="addr.isDefault" [class.bg-indigo-50/10]="addr.isDefault" [class.border-gray-100]="!addr.isDefault">
      
      <!-- Default Badge -->
      <span *ngIf="addr.isDefault" 
        class="absolute right-4 top-4 rounded-full bg-indigo-600 px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider text-white">
        Default
      </span>

      <div class="flex flex-1 flex-col">
        <div class="flex items-center gap-x-2 text-sm font-bold text-gray-900">
          <app-icon icon="home" classNames="h-4 w-4 text-gray-400"></app-icon>
          {{ addr.label || 'Other' }}
        </div>
        
        <p class="mt-3 text-sm leading-relaxed text-gray-600">
          {{ addr.street }}<br>
          {{ addr.city }}, {{ addr.state }} {{ addr.zipCode }}<br>
          {{ addr.country }}
        </p>

        <div class="mt-5 flex items-center gap-x-4">
          <button (click)="openEditModal(addr)" class="text-xs font-semibold text-indigo-600 hover:text-indigo-700">Edit</button>
          <button *ngIf="!addr.isDefault" (click)="onSetDefault(addr.id!)" class="text-xs font-semibold text-gray-500 hover:text-indigo-600">Set Default</button>
          <button *ngIf="!addr.isDefault" (click)="onDelete(addr.id!)" class="text-xs font-semibold text-rose-500 hover:text-rose-600">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Empty state -->
  <div *ngIf="(addresses$ | async)?.length === 0" class="flex flex-col items-center justify-center rounded-2xl border-2 border-dashed border-gray-100 py-12 text-center">
    <app-icon icon="truck" classNames="h-10 w-10 text-gray-300"></app-icon>
    <p class="mt-4 text-sm font-medium text-gray-500">No addresses found. Add one to speed up checkout.</p>
  </div>

  <app-address-modal [isOpened]="isModalOpened" [address]="selectedAddress" (closed)="onCloseModal($event)"></app-address-modal>
</div>
