<div *ngIf="isModalOpened" class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <!-- Backdrop -->
  <div class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm transition-opacity" (click)="onClose()"></div>

  <!-- Modal -->
  <div class="relative w-full max-w-md transform overflow-hidden rounded-2xl bg-white p-8 shadow-2xl transition-all duration-300 animate-in fade-in zoom-in slide-in-from-top-4">
    
    <!-- Close button -->
    <button (click)="onClose()" class="absolute right-4 top-4 text-gray-400 hover:text-gray-600">
      <app-icon icon="x-mark" classNames="h-6 w-6"></app-icon>
    </button>

    <div class="mb-6 text-center">
      <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-indigo-50 text-indigo-600">
        <app-icon icon="lock" classNames="h-8 w-8"></app-icon>
      </div>
      <h3 class="text-2xl font-bold text-gray-900">Change Password</h3>
      <p class="mt-2 text-sm text-gray-500">Keep your account secure with a strong password.</p>
    </div>

    <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()" class="space-y-4">
      
      <!-- Old Password -->
      <div>
        <label for="oldPassword" class="block text-sm font-semibold text-gray-700">Current Password</label>
        <div class="relative mt-1">
          <input type="password" id="oldPassword" formControlName="oldPassword"
            class="block w-full rounded-xl border-gray-200 px-4 py-3 text-sm focus:border-indigo-500 focus:ring-indigo-500"
            [class.border-red-500]="formData['oldPassword'] | isInvalid" placeholder="••••••••">
        </div>
        <p *ngIf="formData['oldPassword'] | hasError:'required'" class="mt-1 text-xs text-red-500">
          Password is required
        </p>
      </div>

      <!-- New Password -->
      <div>
        <label for="newPassword" class="block text-sm font-semibold text-gray-700">New Password</label>
        <div class="relative mt-1">
          <input type="password" id="newPassword" formControlName="newPassword"
            class="block w-full rounded-xl border-gray-200 px-4 py-3 text-sm focus:border-indigo-500 focus:ring-indigo-500"
            [class.border-red-500]="formData['newPassword'] | isInvalid" placeholder="••••••••">
        </div>
        <p *ngIf="formData['newPassword'] | hasError:'required'" class="mt-1 text-xs text-red-500">
          New password is required
        </p>
        <p *ngIf="formData['newPassword'] | hasError:'minlength'" class="mt-1 text-xs text-red-500">
          Password must be at least 6 characters
        </p>
      </div>

      <!-- Confirm Password -->
      <div>
        <label for="confirmPassword" class="block text-sm font-semibold text-gray-700">Confirm New Password</label>
        <div class="relative mt-1">
          <input type="password" id="confirmPassword" formControlName="confirmPassword"
            class="block w-full rounded-xl border-gray-200 px-4 py-3 text-sm focus:border-indigo-500 focus:ring-indigo-500"
            [class.border-red-500]="formData['confirmPassword'] | isInvalid" placeholder="••••••••">
        </div>
      </div>

      <div class="mt-8">
        <button type="submit" [disabled]="reqInProgress"
          class="flex w-full items-center justify-center rounded-xl bg-indigo-600 px-6 py-3 text-sm font-bold text-white shadow-lg transition hover:bg-indigo-700 active:scale-95 disabled:opacity-50">
          <span *ngIf="reqInProgress" class="mr-2 h-4 w-4 animate-spin rounded-full border-2 border-white border-t-transparent"></span>
          {{ reqInProgress ? 'Updating...' : 'Update Password' }}
        </button>
      </div>

    </form>
  </div>
</div>
