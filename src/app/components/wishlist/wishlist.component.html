<div class="min-h-screen bg-gray-50 py-12">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    
    <!-- ── Header ── -->
    <div class="mb-10 flex flex-wrap items-center justify-between border-b border-gray-200 pb-6 gap-4">
      <div>
        <h1 class="text-3xl font-extrabold tracking-tight text-gray-900">Your Wishlist</h1>
        <p class="mt-2 text-sm text-gray-500">Products you've saved for later.</p>
      </div>
      <div class="flex items-center gap-x-4">
        @if ((wishlist$ | async)?.length) {
          <button (click)="clearAll()" class="text-sm font-semibold text-rose-600 hover:text-rose-500 transition-colors">
            Clear all
          </button>
        }
        <a [routerLink]="['/shop']" class="text-sm font-semibold text-indigo-600 hover:text-indigo-500 group flex items-center">
          Continue Shopping 
          <span aria-hidden="true" class="ml-1 transition-transform group-hover:translate-x-1"> &rarr;</span>
        </a>
      </div>
    </div>

    <!-- ── Content ── -->
    <ng-container *ngIf="wishlist$ | async as items">
      
      <!-- Empty State -->
      <div *ngIf="items.length === 0" class="flex flex-col items-center justify-center rounded-3xl border-2 border-dashed border-gray-200 bg-white p-12 text-center transition-all duration-300 hover:border-gray-300 shadow-sm">
        <div class="flex h-20 w-20 items-center justify-center rounded-full bg-indigo-50 text-indigo-500">
          <app-icon icon="heart-outline" classNames="h-10 w-10"></app-icon>
        </div>
        <h3 class="mt-6 text-xl font-bold text-gray-900">Your wishlist is empty</h3>
        <p class="mt-2 max-w-xs text-sm text-gray-500">
          Capture the things you love today and they'll be here waiting for you.
        </p>
        <div class="mt-8">
          <a [routerLink]="['/shop']" class="inline-flex items-center rounded-xl bg-indigo-600 px-8 py-3 text-sm font-bold text-white shadow-xl transition-all duration-200 hover:bg-indigo-700 active:scale-95">
            Explore Shop
          </a>
        </div>
      </div>

      <!-- Grid -->
      <div *ngIf="items.length > 0" class="grid grid-cols-1 gap-x-6 gap-y-10 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 xl:gap-x-8">
        <div *ngFor="let item of items" class="animate-fade-in">
          <app-product-card *ngIf="item.product" [product]="item.product"></app-product-card>
        </div>
      </div>

    </ng-container>

  </div>
</div>
