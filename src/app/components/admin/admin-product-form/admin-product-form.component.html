<div class="px-4 sm:px-6 lg:px-8 py-8 w-full max-w-4xl mx-auto">
  
  <div class="mb-8 flex items-center justify-between">
    <div class="flex items-center space-x-4">
      <a routerLink="/admin/products" class="h-10 w-10 flex items-center justify-center bg-white border border-gray-200 rounded-lg text-gray-400 hover:text-gray-600 shadow-sm transition-colors">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
      </a>
      <h1 class="text-2xl md:text-3xl text-gray-800 font-bold whitespace-nowrap">{{ isEditMode ? 'Edit Product' : 'Create Product' }}</h1>
    </div>
  </div>

  <div *ngIf="loading && isEditMode" class="flex justify-center p-12">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
  </div>

  <form *ngIf="!loading || !isEditMode" [formGroup]="productForm" (ngSubmit)="onSubmit()" class="space-y-8">
    
    <!-- General Details -->
    <div class="bg-white p-6 md:p-8 rounded-xl shadow-sm border border-gray-200">
      <h2 class="text-lg font-semibold text-gray-800 mb-6">General Information</h2>
      
      <div class="space-y-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Product Name <span class="text-red-500">*</span></label>
          <input type="text" formControlName="name" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2.5">
          <p *ngIf="productForm.get('name')?.invalid && productForm.get('name')?.touched" class="mt-1 text-sm text-red-500">Name is required.</p>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Short Description <span class="text-red-500">*</span></label>
          <input type="text" formControlName="shortDescription" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2.5">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Full Description <span class="text-red-500">*</span></label>
          <textarea formControlName="description" rows="4" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2.5"></textarea>
        </div>
      </div>
    </div>

    <!-- Pricing & Stock -->
    <div class="bg-white p-6 md:p-8 rounded-xl shadow-sm border border-gray-200">
      <h2 class="text-lg font-semibold text-gray-800 mb-6">Pricing & Inventory</h2>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Price (USD) <span class="text-red-500">*</span></label>
          <input type="number" formControlName="price" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2.5" step="0.01">
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Discount (%)</label>
          <input type="number" formControlName="discount" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2.5">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Stock Quantity <span class="text-red-500">*</span></label>
          <input type="number" formControlName="stockQuantity" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2.5">
        </div>
      </div>
    </div>

    <!-- Classification & Metadata -->
    <div class="bg-white p-6 md:p-8 rounded-xl shadow-sm border border-gray-200">
      <h2 class="text-lg font-semibold text-gray-800 mb-6">Classification & Variants</h2>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Category <span class="text-red-500">*</span></label>
          <select formControlName="categoryId" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2.5">
            <option value="">Select a category</option>
            <option *ngFor="let cat of categories" [value]="cat.id">{{cat.name}}</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Brand ID (Optional)</label>
          <input type="text" formControlName="brandId" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2.5" placeholder="e.g. uuid-brand">
        </div>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1 flex items-center justify-between">
            Available Colors
            <span class="text-xs text-gray-500 font-normal">Comma separated</span>
          </label>
          <input type="text" [value]="colorsText" (change)="setColors($event)" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2.5" placeholder="Red, Blue, Green">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1 flex items-center justify-between">
            Available Sizes
            <span class="text-xs text-gray-500 font-normal">Comma separated</span>
          </label>
          <input type="text" [value]="sizesText" (change)="setSizes($event)" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2.5" placeholder="S, M, L, XL">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1 flex items-center justify-between">
            Image URLs
            <span class="text-xs text-gray-500 font-normal">Comma separated links</span>
          </label>
          <textarea [value]="imagesText" (change)="setImages($event)" rows="3" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2.5" placeholder="https://example.com/img1.jpg, https://example.com/img2.jpg"></textarea>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="flex justify-end space-x-4 border-t pt-6">
      <a routerLink="/admin/products" class="px-6 py-2.5 text-gray-700 font-medium bg-white border border-gray-300 rounded-xl hover:bg-gray-50 transition-colors">
        Cancel
      </a>
      <button [disabled]="loading || productForm.invalid" type="submit" class="px-6 py-2.5 text-white font-medium bg-blue-600 rounded-xl hover:bg-blue-700 transition-colors disabled:opacity-50 flex items-center">
        <svg *ngIf="loading" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        Save Product
      </button>
    </div>

  </form>
</div>
