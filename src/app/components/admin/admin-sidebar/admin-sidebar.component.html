<aside class="hidden h-screen w-72 shrink-0 border-r border-slate-200 bg-white lg:flex lg:flex-col sticky top-0">
  <div class="border-b border-slate-200 p-6">
    <a routerLink="/admin/dashboard" class="flex items-center gap-3 rounded-xl p-2 transition hover:bg-slate-50">
      <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-slate-900 text-white">
        <svg class="h-7 w-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
        </svg>
      </div>
      <div>
        <div class="text-[10px] font-bold uppercase tracking-[0.3em] text-slate-400">Shopizy</div>
        <div class="mt-1 text-lg font-semibold tracking-tight text-slate-900">Admin</div>
        <div class="mt-1 text-sm text-slate-500">Operations panel</div>
      </div>
    </a>
  </div>

  <div class="flex-1 overflow-y-auto px-4 py-6 custom-scrollbar">
    <div class="mb-4 px-3 text-[10px] font-bold uppercase tracking-[0.3em] text-slate-400">Navigation</div>
    <nav class="space-y-2">
      <a *ngFor="let item of mainNav" [routerLink]="item.route" routerLinkActive="active-link" class="nav-item group">
        <svg class="nav-icon h-5 w-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.icon"></path>
        </svg>
        <span class="flex-1 text-sm font-medium tracking-tight">{{ item.label }}</span>
      </a>
    </nav>

    <div class="mt-8 rounded-2xl border border-slate-200 bg-slate-50 p-4">
      <div class="text-[10px] font-bold uppercase tracking-[0.3em] text-slate-400">Workflow</div>
      <div class="mt-3 text-base font-semibold tracking-tight text-slate-900">Fast, quiet, focused.</div>
      <p class="mt-2 text-sm leading-6 text-slate-500">Minimal panels, fewer distractions, quicker actions.</p>
      <a routerLink="/" class="mt-4 inline-flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-medium text-slate-700 transition hover:bg-slate-100">
        <span>Back to store</span>
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l7-7m0 0l-7-7m7 7H3"/></svg>
      </a>
    </div>
  </div>

  <div class="border-t border-slate-200 p-5">
    <div class="flex items-center justify-between rounded-xl bg-slate-50 px-4 py-3">
      <div>
        <div class="text-xs font-medium text-slate-900">System online</div>
        <div class="text-[10px] uppercase tracking-[0.25em] text-slate-400">Last sync now</div>
      </div>
      <div class="h-3 w-3 rounded-full bg-emerald-500"></div>
    </div>
  </div>
</aside>
