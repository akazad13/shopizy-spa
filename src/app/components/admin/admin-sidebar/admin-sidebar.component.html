<aside class="hidden h-screen w-72 shrink-0 border-r border-slate-200/80 bg-white/90 backdrop-blur-xl lg:flex lg:flex-col sticky top-0 z-40 shadow-sm">
  <!-- Brand Header -->
  <div class="flex h-16 shrink-0 items-center border-b border-slate-200/80 px-6">
    <a routerLink="/admin/dashboard" class="group flex items-center gap-3 transition-all">
      <div class="relative flex h-10 w-10 shrink-0 items-center justify-center rounded-2xl bg-gradient-to-tr from-slate-900 via-indigo-950 to-slate-800 text-white shadow-md shadow-slate-900/10 transition-transform group-hover:scale-105">
        <svg class="h-5 w-5 text-indigo-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
        </svg>
        <span class="absolute -right-0.5 -top-0.5 flex h-2.5 w-2.5">
          <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex h-2.5 w-2.5 rounded-full bg-emerald-500"></span>
        </span>
      </div>
      <div>
        <div class="flex items-center gap-1.5 leading-none">
          <span class="text-base font-extrabold tracking-tight text-slate-900">Shopizy</span>
          <span class="rounded-md bg-indigo-50 px-1.5 py-0.5 text-[9px] font-extrabold uppercase tracking-wider text-indigo-600">PRO</span>
        </div>
        <div class="mt-1 text-[11px] font-semibold text-slate-400">Control Center</div>
      </div>
    </a>
  </div>

  <!-- Navigation Items -->
  <div class="flex-1 overflow-y-auto px-4 py-6 custom-scrollbar">
    <div class="mb-3 px-3 text-[10px] font-bold uppercase tracking-[0.25em] text-slate-400">Main Menu</div>
    <nav class="space-y-1.5">
      <a *ngFor="let item of mainNav"
         [routerLink]="item.route"
         routerLinkActive="bg-gradient-to-r from-slate-900 to-indigo-950 text-white shadow-md shadow-slate-900/10 font-semibold"
         [routerLinkActiveOptions]="{ exact: item.route === '/admin/dashboard' }"
         class="group flex items-center gap-3.5 rounded-xl px-4 py-3 text-sm text-slate-600 transition-all hover:bg-slate-100/80 hover:text-slate-900">
        <div class="flex h-7 w-7 items-center justify-center">
          <svg class="h-5 w-5 shrink-0 transition-transform group-hover:scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.icon"></path>
          </svg>
        </div>
        <span class="flex-1 tracking-tight">{{ item.label }}</span>
      </a>
    </nav>

    <!-- Quick Shortcut Card -->
    <div class="mt-8 rounded-2xl border border-slate-200/70 bg-gradient-to-br from-slate-50 via-indigo-50/30 to-slate-50 p-4.5 shadow-sm">
      <div class="flex items-center justify-between">
        <span class="text-[10px] font-bold uppercase tracking-[0.25em] text-indigo-600">Quick Storefront</span>
        <span class="h-2 w-2 rounded-full bg-emerald-500"></span>
      </div>
      <div class="mt-2 text-sm font-semibold tracking-tight text-slate-900">Live Customer Store</div>
      <p class="mt-1 text-xs text-slate-500 leading-relaxed">Preview catalog modifications live on the customer site.</p>
      <a routerLink="/" target="_blank" class="mt-3.5 inline-flex w-full items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white px-3.5 py-2 text-xs font-semibold text-slate-700 shadow-sm transition hover:bg-slate-100 hover:text-slate-900">
        <span>View Storefront</span>
        <svg class="h-3.5 w-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
        </svg>
      </a>
    </div>
  </div>

  <!-- System Health Footer -->
  <div class="border-t border-slate-100 p-4">
    <div class="flex items-center justify-between rounded-xl bg-slate-50/80 border border-slate-200/50 px-3.5 py-2.5">
      <div class="flex items-center gap-2.5">
        <div class="relative flex h-2.5 w-2.5">
          <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex h-2.5 w-2.5 rounded-full bg-emerald-500"></span>
        </div>
        <div>
          <div class="text-xs font-semibold text-slate-900 leading-tight">API Operational</div>
          <div class="text-[9px] uppercase tracking-[0.2em] text-slate-400">v1.0 • HTTPS Live</div>
        </div>
      </div>
    </div>
  </div>
</aside>
