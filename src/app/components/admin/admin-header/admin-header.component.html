<header class="sticky top-0 z-30 h-16 border-b border-slate-200/80 bg-white/80 backdrop-blur-xl">
  <div class="flex h-full items-center justify-between gap-4 px-4 sm:px-6 lg:px-8">
    <div class="flex min-w-0 flex-1 items-center gap-4">
      <div class="hidden lg:flex items-center gap-3">
        <div
          class="flex h-10 w-10 items-center justify-center rounded-2xl bg-gradient-to-tr from-slate-900 via-indigo-950 to-slate-800 text-white shadow-sm">
          <svg class="h-5 w-5 text-indigo-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"
              d="M4 6a2 2 0 012-2h12a2 2 0 012 2v2H4V6zm0 4h16v8a2 2 0 01-2 2H6a2 2 0 01-2-2v-8zm4 3h8" />
          </svg>
        </div>
        <div>
          <div class="text-[10px] font-extrabold uppercase tracking-[0.25em] text-slate-400">Management</div>
          <div class="text-sm font-bold tracking-tight text-slate-900">Shopizy Backoffice</div>
        </div>
      </div>

      <div class="relative w-full max-w-xl group">
        <svg
          class="pointer-events-none absolute left-4 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400 group-focus-within:text-indigo-600 transition-colors"
          fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <input type="text"
          [(ngModel)]="searchTerm"
          (keyup.enter)="onSearch()"
          class="w-full rounded-2xl border border-slate-200/80 bg-slate-50/50 py-2.5 pl-11 pr-12 text-sm text-slate-900 outline-none transition-all focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-500/10 placeholder:text-slate-400 shadow-inner"
          placeholder="Search products catalog, orders, categories...">
        <div
          class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 rounded-lg border border-slate-200 bg-white px-2 py-0.5 text-[10px] font-bold text-slate-400 shadow-2xs">
          ⌘K
        </div>
      </div>
    </div>

    <div class="flex items-center gap-2.5 sm:gap-3.5">
      <!-- Live Indicator -->
      <div
        class="hidden xl:flex items-center gap-2 rounded-2xl border border-emerald-200/60 bg-emerald-50/50 px-3.5 py-2 text-emerald-700 shadow-2xs">
        <span class="relative flex h-2 w-2">
          <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex h-2 w-2 rounded-full bg-emerald-500"></span>
        </span>
        <span class="text-xs font-bold uppercase tracking-wider">Live System</span>
      </div>

      <a *ngFor="let link of quickLinks" [routerLink]="link.route"
        class="hidden sm:inline-flex items-center rounded-xl px-3.5 py-2 text-xs font-bold transition-all shadow-2xs hover:scale-105 active:scale-95"
        [ngClass]="link.tone">
        {{ link.label }}
      </a>

      <!-- Administrator Profile -->
      <div
        class="flex items-center gap-3 rounded-2xl border border-slate-200/80 bg-white px-3 py-1.5 shadow-2xs transition hover:border-slate-300">
        <div class="hidden sm:block text-right">
          <div class="text-xs font-bold text-slate-900 leading-none">Admin User</div>
          <div class="mt-0.5 text-[9px] font-extrabold uppercase tracking-widest text-indigo-600">Super Admin</div>
        </div>
        <div
          class="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-tr from-slate-900 to-indigo-900 font-bold text-xs text-white shadow-sm">
          AD
        </div>
      </div>
    </div>
  </div>
</header>
