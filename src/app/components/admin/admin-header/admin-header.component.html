<header class="bg-white/80 backdrop-blur-md border-b border-gray-100 h-20 flex items-center justify-between px-8 z-30 w-full sticky top-0 shadow-sm transition-all duration-300">
  <!-- Search -->
  <div class="flex items-center w-1/2 lg:w-1/3 group">
    <div class="relative w-full">
      <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none transition-colors group-focus-within:text-blue-500">
        <svg class="w-4 h-4 text-gray-400 group-focus-within:text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </div>
      <input type="text" 
        class="bg-gray-50/50 border-none ring-1 ring-gray-200/50 text-gray-900 text-sm rounded-2xl focus:ring-2 focus:ring-blue-500/20 focus:ring-offset-2 block w-full pl-11 pr-4 py-2.5 transition-all duration-300 placeholder:text-gray-400" 
        placeholder="Ctrl + K to search everything...">
    </div>
  </div>
  
  <div class="flex items-center space-x-6">
    <!-- Messages -->
    <button class="text-gray-400 hover:text-blue-600 relative p-2 rounded-xl hover:bg-blue-50 transition-all group">
      <svg class="w-6 h-6 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z" />
      </svg>
      <span class="absolute top-1 right-1 flex h-2 w-2">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2 w-2 bg-blue-500"></span>
      </span>
    </button>

    <!-- Notifications -->
    <button class="text-gray-400 hover:text-orange-600 relative p-2 rounded-xl hover:bg-orange-50 transition-all group">
      <svg class="w-6 h-6 group-hover:shake-animation transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
      </svg>
    </button>

    <div class="h-8 w-[1px] bg-gray-100 mx-2 invisible md:visible"></div>

    <!-- Profile -->
    <div class="flex items-center space-x-3 pl-2 group cursor-pointer">
      <div class="text-right hidden sm:block">
        <div class="text-xs font-bold text-gray-800 leading-none mb-0.5">Admin Account</div>
        <div class="text-[10px] text-gray-500 font-medium tracking-wide uppercase">Administrator</div>
      </div>
      <div class="h-11 w-11 bg-gradient-to-tr from-gray-100 to-gray-200 border-2 border-white ring-1 ring-gray-100 rounded-2xl flex items-center justify-center font-bold text-gray-700 shadow-sm group-hover:shadow-md transition-all group-hover:-translate-y-0.5 overflow-hidden">
        <span class="group-hover:hidden uppercase">AD</span>
        <svg class="w-6 h-6 hidden group-hover:block text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </div>
    </div>
  </div>
</header>
