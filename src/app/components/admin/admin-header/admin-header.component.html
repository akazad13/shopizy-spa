<header class="sticky top-0 z-30 border-b border-slate-200 bg-white/90 backdrop-blur-md">
  <div class="flex items-center justify-between gap-4 px-4 py-4 sm:px-6 lg:px-8">
    <div class="flex min-w-0 flex-1 items-center gap-4">
      <div class="hidden lg:flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-slate-900 text-white">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6a2 2 0 012-2h12a2 2 0 012 2v2H4V6zm0 4h16v8a2 2 0 01-2 2H6a2 2 0 01-2-2v-8zm4 3h8" />
          </svg>
        </div>
        <div>
          <div class="text-[10px] font-bold uppercase tracking-[0.3em] text-slate-400">Admin</div>
          <div class="text-sm font-semibold text-slate-900">Shopizy back office</div>
        </div>
      </div>

      <div class="relative w-full max-w-2xl group">
        <svg class="pointer-events-none absolute left-5 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400 group-focus-within:text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <input type="text"
          class="w-full rounded-xl border border-slate-200 bg-white py-3 pl-12 pr-4 text-sm text-slate-900 outline-none transition focus:border-slate-400 placeholder:text-slate-400"
          placeholder="Search admin data...">
      </div>
    </div>

    <div class="flex items-center gap-2 sm:gap-3">
      <div class="hidden xl:flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-4 py-3 text-slate-600">
        <span class="h-2.5 w-2.5 rounded-full bg-emerald-500"></span>
        <span class="text-xs font-semibold uppercase tracking-[0.18em]">Live</span>
      </div>

      <a *ngFor="let link of quickLinks" [routerLink]="link.route"
        class="hidden sm:inline-flex items-center rounded-xl px-4 py-2.5 text-sm font-semibold transition-all"
        [ngClass]="link.tone">
        {{ link.label }}
      </a>

      <button class="inline-flex h-11 w-11 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-500 transition hover:text-slate-900">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
        </svg>
      </button>

      <div class="flex items-center gap-3 rounded-xl border border-slate-200 bg-white px-3 py-2.5">
        <div class="hidden sm:block text-right">
          <div class="text-xs font-semibold text-slate-900 leading-none">Admin Account</div>
          <div class="mt-1 text-[10px] uppercase tracking-[0.25em] text-slate-400">Administrator</div>
        </div>
        <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-slate-100 font-semibold text-slate-700">
          AD
        </div>
      </div>
    </div>
  </div>
</header>
