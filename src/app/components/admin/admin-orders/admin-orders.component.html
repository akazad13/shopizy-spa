<div class="px-4 sm:px-6 lg:px-8 py-8 w-full max-w-9xl mx-auto">
  <!-- Page header -->
  <div class="sm:flex sm:justify-between sm:items-center mb-8">
    <div class="mb-4 sm:mb-0">
      <h1 class="text-2xl md:text-3xl text-gray-800 font-bold">Orders 📦</h1>
    </div>
  </div>

  <div *ngIf="loading" class="flex justify-center p-12">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
  </div>

  <!-- Table Section -->
  <div *ngIf="!loading" class="bg-white shadow-sm rounded-xl border border-gray-200">
    <header class="px-5 py-4 border-b border-gray-100 flex justify-between items-center">
      <h2 class="font-semibold text-gray-800">All Orders <span class="text-gray-400 font-medium ml-1">({{orders.length}})</span></h2>
    </header>
    <div class="p-3 overflow-x-auto">
      <table class="table-auto w-full w-full">
        <!-- Table header -->
        <thead class="text-xs font-semibold uppercase text-gray-400 bg-gray-50 border-y border-gray-200">
          <tr>
            <th class="p-3 text-left"><div class="font-semibold">Order ID</div></th>
            <th class="p-3 text-left"><div class="font-semibold">Date</div></th>
            <th class="p-3 text-left"><div class="font-semibold">Total</div></th>
            <th class="p-3 text-center"><div class="font-semibold">Status</div></th>
            <th class="p-3 text-center"><div class="font-semibold">Actions</div></th>
          </tr>
        </thead>
        <!-- Table body -->
        <tbody class="text-sm divide-y divide-gray-100">
          <tr *ngFor="let order of orders" class="hover:bg-gray-50 transition-colors">
            <td class="p-3">
              <div class="font-medium text-blue-600">#{{order.orderId.substring(0,8)}}...</div>
            </td>
            <td class="p-3">
              <div class="text-gray-600">{{order.createdOn | date:'medium'}}</div>
            </td>
            <td class="p-3">
              <div class="text-gray-800 font-semibold">{{order.total.amount | currency:order.total.currency}}</div>
            </td>
            <td class="p-3 text-center">
              <span class="inline-flex font-medium rounded-full text-center px-2.5 py-1 text-xs" 
                    [ngClass]="{
                      'bg-yellow-100 text-yellow-600': order.orderStatus === 'Pending' || order.orderStatus === '1',
                      'bg-blue-100 text-blue-600': order.orderStatus === 'Processing' || order.orderStatus === '2',
                      'bg-indigo-100 text-indigo-600': order.orderStatus === 'Shipping' || order.orderStatus === '3',
                      'bg-green-100 text-green-600': order.orderStatus === 'Delivered' || order.orderStatus === '4',
                      'bg-red-100 text-red-600': order.orderStatus === 'Cancelled' || order.orderStatus === '5'
                    }">
                {{ getStatusName(order.orderStatus) }}
              </span>
            </td>
            <td class="p-3 w-32 border-l border-gray-50 text-center">
              <a [routerLink]="['/admin/orders', order.orderId]" class="text-gray-400 hover:text-blue-500 rounded-full p-1 transition-colors mr-2 cursor-pointer inline-block">
                View Details
              </a>
            </td>
          </tr>
          <tr *ngIf="orders.length === 0">
            <td colspan="5" class="p-6 text-center text-gray-500">
              No orders found matching the criteria.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
