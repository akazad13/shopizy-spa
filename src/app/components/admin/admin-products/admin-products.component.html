<div class="px-4 sm:px-6 lg:px-8 py-8 w-full max-w-9xl mx-auto">
  <!-- Page header -->
  <div class="sm:flex sm:justify-between sm:items-center mb-8">
    <div class="mb-4 sm:mb-0">
      <h1 class="text-2xl md:text-3xl text-gray-800 font-bold">Products ✨</h1>
    </div>

    <!-- Right: Actions -->
    <div class="grid grid-flow-col sm:auto-cols-max justify-start sm:justify-end gap-2">
      <a routerLink="/admin/products/new" class="btn bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg flex items-center shadow-sm transition-colors cursor-pointer">
        <svg class="w-4 h-4 fill-current opacity-50 shrink-0 border-2 rounded-full mr-2" viewBox="0 0 16 16"><path d="M15 7H9V1c0-.6-.4-1-1-1S7 .4 7 1v6H1c-.6 0-1 .4-1 1s.4 1 1 1h6v6c0 .6.4 1 1 1s1-.4 1-1V9h6c.6 0 1-.4 1-1s-.4-1-1-1z"/></svg>
        <span class="hidden xs:block ml-2">Add Product</span>
      </a>
    </div>
  </div>

  <!-- Table Section -->
  <div class="bg-white shadow-sm rounded-xl border border-gray-200">
    <header class="px-5 py-4 border-b border-gray-100 flex justify-between items-center">
      <h2 class="font-semibold text-gray-800">All Products <span class="text-gray-400 font-medium ml-1">({{products.length}})</span></h2>
    </header>
    <div class="p-3 overflow-x-auto">
      <table class="table-auto w-full w-full">
        <!-- Table header -->
        <thead class="text-xs font-semibold uppercase text-gray-400 bg-gray-50 border-y border-gray-200">
          <tr>
            <th class="p-3 text-left w-12"><div class="font-semibold text-center">No.</div></th>
            <th class="p-3 text-left"><div class="font-semibold">Product</div></th>
            <th class="p-3 text-left"><div class="font-semibold">Category</div></th>
            <th class="p-3 text-left"><div class="font-semibold">Price</div></th>
            <th class="p-3 text-left"><div class="font-semibold">Stock</div></th>
            <th class="p-3 text-left"><div class="font-semibold text-center">Status</div></th>
            <th class="p-3 text-center"><div class="font-semibold">Actions</div></th>
          </tr>
        </thead>
        <!-- Table body -->
        <tbody class="text-sm divide-y divide-gray-100">
          <tr *ngFor="let product of products; let i = index" class="hover:bg-gray-50 transition-colors">
            <td class="p-3 text-center text-gray-500 font-medium">{{ i + 1 }}</td>
            <td class="p-3 flex items-center">
              <div class="w-10 h-10 shrink-0 mr-3 hidden sm:block bg-gray-100 rounded-lg overflow-hidden border">
                <img *ngIf="product.productImages && product.productImages.length" [src]="product.productImages[0].imageUrl" width="40" height="40" alt="{{product.name}}" />
              </div>
              <div>
                <div class="font-medium text-gray-800">{{product.name}}</div>
                <div class="text-xs text-gray-400 mt-0.5">ID: {{product.productId.substr(0, 8)}}</div>
              </div>
            </td>
            <td class="p-3 text-gray-600">{{ getCategoryName(product.categoryId) }}</td>
            <td class="p-3 font-semibold text-gray-800">${{product.price.toFixed(2)}}</td>
            <td class="p-3">
              <span class="inline-flex items-center text-sm" [ngClass]="product.stockQuantity > 10 ? 'text-green-600' : 'text-orange-500'">
                {{product.stockQuantity}} In Stock
              </span>
            </td>
            <td class="p-3 text-center">
              <div class="text-xs inline-flex font-medium bg-green-100 text-green-600 rounded-full text-center px-2.5 py-1">Active</div>
            </td>
            <td class="p-3 w-32 border-l border-gray-50 text-center">
              <a [routerLink]="['/admin/products', product.productId]" class="text-gray-400 hover:text-blue-500 rounded-full p-1 transition-colors mr-2 cursor-pointer inline-block">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
              </a>
              <button (click)="deleteProduct(product.productId)" class="text-gray-400 hover:text-red-500 rounded-full p-1 transition-colors">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    
    <div class="p-5 border-t border-gray-100 flex justify-center">
      <app-pagination [pageNumber]="filters.pageNumber" [totalPages]="totalPages" (pageChanged)="onPageChange($event)"></app-pagination>
    </div>
  </div>
</div>
