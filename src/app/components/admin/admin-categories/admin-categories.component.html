<div class="px-6 py-8 w-full max-w-[1200px] mx-auto animate-in fade-in slide-in-from-bottom-4 duration-700">
  
  <div class="flex flex-col md:flex-row md:items-center justify-between mb-10 gap-4">
    <div>
      <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Categories</h1>
      <p class="text-slate-500 mt-1 font-medium">Organize and structure your store's taxonomy</p>
    </div>
    <div class="grid grid-flow-col sm:auto-cols-max justify-start sm:justify-end gap-2">
      <button (click)="onAdd()" class="bg-blue-600 text-white px-6 py-2.5 rounded-2xl font-bold text-sm hover:bg-blue-700 transition-all shadow-md shadow-blue-200 flex items-center">
        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
        New Category
      </button>
    </div>
  </div>

  <!-- Form Section -->
  <div *ngIf="showForm" class="bg-white shadow-2xl shadow-slate-200/50 rounded-[2.5rem] border border-slate-100 p-8 mb-10 mt-4 animate-in zoom-in-95 duration-300 max-w-2xl mx-auto overflow-hidden relative">
    <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-blue-500 to-indigo-600"></div>
    
    <div class="flex justify-between items-center mb-8">
      <div>
        <h3 class="text-2xl font-black text-slate-900 tracking-tight">{{ isEditMode ? 'Edit Category' : 'Create Category' }}</h3>
        <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mt-1">Classification Settings</p>
      </div>
      <button (click)="resetForm()" class="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-50 rounded-xl transition-all">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    
    <form (ngSubmit)="onSubmit()" class="space-y-6">
      <div class="grid grid-cols-1 gap-6">
        <div class="space-y-2">
          <label class="block text-xs font-black text-slate-500 uppercase tracking-widest ml-1">Category Name</label>
          <input name="name" [(ngModel)]="categoryForm.name" type="text" placeholder="e.g. Summer Essentials" 
            class="w-full px-5 py-4 bg-slate-50/50 border-none ring-1 ring-slate-200 rounded-2xl text-sm focus:ring-2 focus:ring-blue-500/20 transition-all placeholder:text-slate-300" required />
        </div>

        <div class="space-y-2">
          <label class="block text-xs font-black text-slate-500 uppercase tracking-widest ml-1">Parent Relationship</label>
          <div class="relative group">
            <select name="parentId" [(ngModel)]="categoryForm.parentId" 
              class="w-full px-5 py-4 bg-slate-50/50 border-none ring-1 ring-slate-200 rounded-2xl text-sm focus:ring-2 focus:ring-blue-500/20 transition-all appearance-none cursor-pointer">
              <option [ngValue]="null">Main Category (Global)</option>
              <ng-container *ngFor="let cat of categories">
                <option *ngIf="cat.id !== categoryForm.id" [ngValue]="cat.id">{{ cat.name }}</option>
              </ng-container>
            </select>
            <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
            </div>
          </div>
        </div>

        <div class="space-y-2">
          <label class="block text-xs font-black text-slate-500 uppercase tracking-widest ml-1">Description</label>
          <textarea name="description" [(ngModel)]="categoryForm.description" placeholder="Brief explanation of what this category contains..." 
            class="w-full px-5 py-4 bg-slate-50/50 border-none ring-1 ring-slate-200 rounded-2xl text-sm focus:ring-2 focus:ring-blue-500/20 transition-all placeholder:text-slate-300 h-32 resize-none"></textarea>
        </div>
      </div>

      <div class="flex gap-4 pt-4">
        <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-black py-4 px-6 rounded-2xl shadow-lg shadow-blue-200 transition-all transform hover:-translate-y-0.5 active:translate-y-0 text-sm">
          {{ isEditMode ? 'Save Changes' : 'Publish Category' }}
        </button>
      </div>
    </form>
  </div>

  <div *ngIf="loading" class="flex flex-col justify-center items-center py-32 space-y-4">
    <div class="h-12 w-12 rounded-full border-4 border-slate-100 border-t-indigo-600 animate-spin"></div>
    <p class="text-slate-400 font-bold text-xs tracking-widest uppercase animate-pulse">Mapping Store Structure...</p>
  </div>

  <div *ngIf="!loading && !showForm" class="bg-white shadow-2xl shadow-slate-200/50 rounded-[2.5rem] border border-slate-100 overflow-hidden">
    <div class="overflow-x-auto p-4 lg:p-6">
      <table class="w-full text-left">
        <thead>
          <tr class="text-slate-400 text-[10px] uppercase tracking-[0.2em] font-black border-b border-slate-50">
            <th class="px-6 py-5">Classification</th>
            <th class="px-6 py-5">Metadata</th>
            <th class="px-6 py-5 text-right">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-50">
          <tr *ngFor="let cat of categories" class="category-row hover:bg-slate-50/80 transition-all duration-300 group">

            <td class="px-6 py-6 font-black text-slate-800 tracking-tight text-base">
              <div class="flex items-center">
                <div class="h-8 w-8 bg-indigo-50 text-indigo-500 rounded-xl flex items-center justify-center mr-3 font-bold text-xs uppercase">{{ cat.name.charAt(0) }}</div>
                {{ cat.name }}
              </div>
            </td>
            <td class="px-6 py-6 text-slate-500 text-sm font-medium italic">
              {{ cat.description || 'No description provided' }}
            </td>
            <td class="px-6 py-6 text-right space-x-2">
              <button (click)="onEdit(cat)" class="p-2.5 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 hover:shadow-inner rounded-xl transition-all duration-300 bg-slate-50/50">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                </svg>
              </button>
              <button (click)="onDelete(cat.id)" class="p-2.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 hover:shadow-inner rounded-xl transition-all duration-300 bg-slate-50/50">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
