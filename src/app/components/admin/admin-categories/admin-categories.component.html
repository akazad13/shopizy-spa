<div class="px-4 sm:px-6 lg:px-8 py-8 w-full max-w-9xl mx-auto">
  <div class="sm:flex sm:justify-between sm:items-center mb-8">
    <div class="mb-4 sm:mb-0">
      <h1 class="text-2xl md:text-3xl text-gray-800 font-bold">Categories 📂</h1>
    </div>
    <div class="grid grid-flow-col sm:auto-cols-max justify-start sm:justify-end gap-2">
      <button (click)="onAdd()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-xl transition-colors">
        + Add Category
      </button>
    </div>
  </div>

  <div *ngIf="showForm" class="bg-white shadow-xl rounded-2xl border border-gray-100 p-6 mb-8 mt-4 animate-fade-in max-w-lg mx-auto">
    <div class="flex justify-between items-center mb-6 border-b border-gray-50 pb-4">
      <h3 class="text-xl font-bold text-gray-800">{{ isEditMode ? 'Edit Category' : 'New Category' }}</h3>
      <button (click)="resetForm()" class="text-gray-400 hover:text-gray-600">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    
    <form (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Name</label>
        <input name="name" [(ngModel)]="categoryForm.name" type="text" placeholder="Entry category name" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-50 transition-all outline-none" required />
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Description</label>
        <textarea name="description" [(ngModel)]="categoryForm.description" placeholder="Optional description..." class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-50 transition-all outline-none h-24"></textarea>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Parent Category (Optional)</label>
        <select name="parentId" [(ngModel)]="categoryForm.parentId" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-50 transition-all outline-none bg-white">
          <option [ngValue]="null">None (Main Category)</option>
          <ng-container *ngFor="let cat of categories">
            <option *ngIf="cat.id !== categoryForm.id" [ngValue]="cat.id">{{ cat.name }}</option>
          </ng-container>
        </select>
      </div>

      <div class="flex gap-3 pt-4">
        <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl shadow-lg shadow-indigo-100 transition-all transform hover:-translate-y-0.5 active:translate-y-0">
          {{ isEditMode ? 'Update Category' : 'Create Category' }}
        </button>
      </div>
    </form>
  </div>

  <div *ngIf="loading" class="flex justify-center p-12">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
  </div>

  <div *ngIf="!loading && !showForm" class="bg-white shadow-sm rounded-2xl border border-gray-200">
    <div class="overflow-x-auto p-4">
      <table class="table-auto w-full">
        <thead class="text-xs font-semibold uppercase text-gray-400 bg-gray-50 border-y border-gray-100">
          <tr>
            <th class="p-4 text-left font-semibold">Name</th>
            <th class="p-4 text-left font-semibold">Description</th>
            <th class="p-4 text-center font-semibold">Actions</th>
          </tr>
        </thead>
        <tbody class="text-sm divide-y divide-gray-100">
          <tr *ngFor="let cat of categories" class="hover:bg-gray-50 transition-colors duration-150">
            <td class="p-4 font-medium text-gray-800">{{ cat.name }}</td>
            <td class="p-4 text-gray-500">{{ cat.description || '—' }}</td>
            <td class="p-4 text-center space-x-2">
              <button (click)="onEdit(cat)" class="text-indigo-600 hover:text-indigo-800 p-2 rounded-lg hover:bg-indigo-50 transition-colors">
                Edit
              </button>
              <button (click)="onDelete(cat.id)" class="text-rose-600 hover:text-rose-800 p-2 rounded-lg hover:bg-rose-50 transition-colors">
                Delete
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
