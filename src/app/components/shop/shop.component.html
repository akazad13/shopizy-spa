<div class="min-h-screen bg-gray-50">
  <!-- Mobile filter drawer -->
  <app-mobile-filters
    (hideMobileFiltersOutput)="showHideMobileFiltersDrawer($event)"
    [shopFilterState]="shopFilterState"
    [brands]="brands"
    [categoryTree]="categoryTree"
    (updateFilterStateOutput)="updateFilterState($event)"
    (updateProductGridOutput)="updateProductGrid($event)"
  ></app-mobile-filters>

  <main class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <!-- ── Top bar: breadcrumb + sort/filter controls ── -->
    <div
      class="flex items-center justify-between border-b border-gray-200 pb-5 pt-6"
    >
      <!-- Breadcrumb -->
      <nav aria-label="Breadcrumb">
        <ol class="flex items-center gap-x-1.5">
          <li>
            <a
              href="/"
              class="flex items-center gap-x-1 text-sm text-gray-500 transition-colors hover:text-gray-800"
            >
              <app-icon
                icon="home-solid"
                classNames="h-4 w-4 text-gray-400"
              ></app-icon>
              Home
            </a>
          </li>
          <li class="flex items-center">
            <app-icon
              icon="chevron-right"
              classNames="h-4 w-4 text-gray-300"
            ></app-icon>
          </li>
          <li>
            <span aria-current="page" class="text-sm font-medium text-gray-800"
              >Shop</span
            >
          </li>
        </ol>
      </nav>

      <!-- Right controls -->
      <div class="flex items-center gap-x-3">
        <!-- Sort dropdown -->
        <div class="relative inline-block text-left">
          <button
            id="sort-menu-button"
            type="button"
            aria-haspopup="true"
            [attr.aria-expanded]="!shopFilterState.hideSortingOptions"
            (click)="showHideSortingOptions()"
            class="inline-flex items-center gap-x-1.5 rounded-lg border border-gray-200 bg-white px-3.5 py-2 text-sm font-medium text-gray-700 shadow-sm transition-colors duration-150 hover:border-gray-300 hover:bg-gray-50 focus:outline-none"
          >
            <app-icon icon="sort" classNames="h-4 w-4 text-gray-400"></app-icon>
            Sort
            <app-icon
              icon="chevron-down"
              classNames="h-4 w-4 text-gray-400 transition-transform duration-200"
              [class.rotate-180]="!shopFilterState.hideSortingOptions"
            ></app-icon>
          </button>

          <!-- Dropdown menu -->
          <div
            aria-labelledby="sort-menu-button"
            [ngClass]="
              shopFilterState.hideSortingOptions
                ? 'pointer-events-none scale-95 opacity-0 transition duration-100 ease-in'
                : 'pointer-events-auto scale-100 opacity-100 transition duration-150 ease-out'
            "
            class="absolute right-0 z-20 mt-2 w-44 origin-top-right rounded-xl bg-white py-1 shadow-xl ring-1 ring-gray-100"
          >
            <ng-container
              *ngFor="let sortingOption of shopFilterState.sortingOptions"
            >
              <button
                type="button"
                class="block w-full px-4 py-2 text-left text-sm text-gray-600 transition-colors duration-100 hover:bg-indigo-50 hover:text-indigo-700"
                (click)="onSort(sortingOption)"
              >
                {{ sortingOption }}
              </button>
            </ng-container>
          </div>
        </div>

        <!-- Mobile filter toggle -->
        <button
          type="button"
          class="inline-flex items-center gap-x-1.5 rounded-lg border border-gray-200 bg-white px-3.5 py-2 text-sm font-medium text-gray-700 shadow-sm transition-colors duration-150 hover:border-gray-300 hover:bg-gray-50 lg:hidden"
          (click)="showHideMobileFiltersDrawer('show')"
        >
          <app-icon icon="funnel" classNames="h-4 w-4"></app-icon>
          <span>Filters</span>
        </button>
      </div>
    </div>

    <!-- ── Body: sidebar + product grid ── -->
    <section aria-labelledby="products-heading" class="pb-24 pt-6">
      <h2 id="products-heading" class="sr-only">Products</h2>

      <div class="grid grid-cols-1 gap-x-8 gap-y-10 lg:grid-cols-4">
        <!-- Filters sidebar -->
        <aside class="hidden lg:block">
          <!-- Sidebar card -->
          <div
            class="rounded-2xl border border-gray-100 bg-white px-4 py-3 shadow-sm"
          >
            <app-shop-filters
              [shopFilterState]="shopFilterState"
              [brands]="brands"
              [categoryTree]="categoryTree"
              (updateFilterStateOutput)="updateFilterState($event)"
              (updateProductGridOutput)="updateProductGrid($event)"
            ></app-shop-filters>
          </div>
        </aside>

        <!-- Product grid -->
        <div class="lg:col-span-3">
          <app-products-grid
            [products]="products"
            [loading]="loadingProducts"
          ></app-products-grid>

          <!-- Pagination -->
          <div class="mt-12 border-t border-gray-100 pt-10">
            <app-pagination
              [pageNumber]="filters.pageNumber"
              [totalPages]="totalPages"
              (pageChanged)="onPageChange($event)"
            >
            </app-pagination>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>
