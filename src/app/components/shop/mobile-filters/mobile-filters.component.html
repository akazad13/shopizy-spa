<div class="relative z-40 lg:hidden" aria-modal="true">
  <div
    class="fixed inset-0 bg-black bg-opacity-25"
    aria-hidden="true"
    [ngClass]="
      hideMobileFilters
        ? 'translate-x-full transform transition duration-300 ease-in-out'
        : 'ttransition translate-x-0 transform duration-300 ease-in-out'
    "
  ></div>

  <div
    class="fixed inset-0 z-40 flex"
    [ngClass]="
      hideMobileFilters
        ? 'translate-x-full transform transition duration-300 ease-in-out'
        : 'translate-x-0 transform transition duration-300 ease-in-out'
    "
  >
    <div
      class="relative ml-auto flex h-full w-full max-w-xs flex-col overflow-y-auto bg-white py-4 pb-12 shadow-xl"
    >
      <div class="flex items-center justify-between px-4">
        <h2 class="text-lg font-medium text-gray-900">Filters</h2>
        <button
          type="button"
          class="-mr-2 flex h-10 w-10 items-center justify-center rounded-md bg-white p-2 text-gray-400"
          (click)="hideMobileDrawer()"
        >
          <span class="sr-only">Close menu</span>
          <app-icon icon="x-mark" classNames="h-6 w-6"></app-icon>
        </button>
      </div>

      <!-- Filters -->
      <form class="mt-4 border-t border-gray-200">
        <div class="border-t border-gray-200 px-4 py-6">
          <h3 class="-mx-2 -my-3 flow-root">
            <!-- Expand/collapse section button -->
            <button
              type="button"
              class="flex w-full items-center justify-between bg-white px-2 py-3 text-gray-400 hover:text-gray-500"
              aria-controls="filter-section-mobile-1"
              aria-expanded="false"
              (click)="updateCategoryCollapsed()"
            >
              <span class="font-medium text-gray-900">Category</span>
              <span class="ml-6 flex items-center">
                <!-- Expand icon, show/hide based on section open state. -->
                <app-icon
                  icon="plus"
                  classNames="h-5 w-5"
                  *ngIf="filterState.categoryCollapsed"
                ></app-icon>
                <!-- Collapse icon, show/hide based on section open state. -->
                <app-icon
                  icon="minus"
                  classNames="h-5 w-5"
                  *ngIf="!filterState.categoryCollapsed"
                ></app-icon>
              </span>
            </button>
          </h3>
          <!-- Filter section, show/hide based on section state. -->
          <div
            class="pt-6"
            id="filter-section-mobile-1"
            *ngIf="!filterState.categoryCollapsed"
          >
            <div class="space-y-6">
              <!-- Tree Root -->
              <div>
                <!-- 1st Level Accordion Group -->
                <div>
                  <!-- 1st Level Accordion -->
                  <div
                    class=""
                    aria-expanded="true"
                    *ngFor="let category of categoriesTree"
                  >
                    <!-- 1st Level Accordion Heading -->
                    <div
                      class="flex w-full items-center gap-x-0.5 rounded-md py-0.5"
                    >
                      <button
                        class="flex size-6 items-center justify-center rounded-md hover:bg-gray-100 focus:bg-gray-100 focus:outline-none disabled:pointer-events-none disabled:opacity-50"
                        aria-expanded="true"
                        aria-controls="checkbox-tree-collapse-one"
                      >
                        <app-icon icon="plus" classNames="h-5 w-5"></app-icon>
                      </button>

                      <div class="grow cursor-pointer rounded-md px-1.5">
                        <span class="text-sm text-gray-800">
                          <label class="flex">
                            <input
                              type="checkbox"
                              class="mt-0.5 shrink-0 rounded border-gray-200 text-blue-600 focus:ring-blue-500 disabled:pointer-events-none disabled:opacity-50"
                              value="assets"
                            />
                            <span class="ms-3">{{ category.name }}</span>
                          </label>
                        </span>
                      </div>
                    </div>
                    <!-- End 1st Level Accordion Heading -->

                    <!-- 1st Level Collapse -->
                    <div
                      id="checkbox-tree-collapse-one"
                      class="w-full overflow-hidden transition-[height] duration-300"
                      aria-labelledby="checkbox-tree-heading-one"
                    >
                      <!-- 2nd Level Accordion Group -->
                      <div
                        class="relative ps-7 before:absolute before:start-3 before:top-0 before:-ms-px before:h-full before:w-0.5 before:bg-gray-100"
                      >
                        <!-- 2nd Level Nested Accordion -->
                        <div
                          class=""
                          aria-expanded="true"
                          id="checkbox-tree-sub-heading-one"
                          *ngFor="let childCategory of category.children"
                        >
                          <!-- 2nd Level Accordion Heading -->
                          <div
                            class="flex w-full items-center gap-x-0.5 rounded-md py-0.5"
                          >
                            <button
                              class="flex size-6 items-center justify-center rounded-md hover:bg-gray-100 focus:bg-gray-100 focus:outline-none disabled:pointer-events-none disabled:opacity-50"
                              aria-expanded="true"
                              aria-controls="checkbox-tree-sub-collapse-one"
                            >
                              <app-icon
                                icon="plus"
                                classNames="h-5 w-5"
                              ></app-icon>
                            </button>

                            <div class="grow cursor-pointer rounded-md px-1.5">
                              <span class="text-sm text-gray-800">
                                <label class="flex">
                                  <input
                                    type="checkbox"
                                    class="mt-0.5 shrink-0 rounded border-gray-200 text-blue-600 focus:ring-blue-500 disabled:pointer-events-none disabled:opacity-50"
                                    value="css"
                                  />
                                  <span class="ms-3">{{
                                    childCategory.name
                                  }}</span>
                                </label>
                              </span>
                            </div>
                          </div>
                          <!-- End 2nd Level Accordion Heading -->

                          <!-- 2nd Level Collapse -->
                          <div
                            id="checkbox-tree-sub-collapse-one"
                            class="w-full overflow-hidden transition-[height] duration-300"
                            aria-labelledby="checkbox-tree-sub-heading-one"
                          >
                            <div
                              class="relative ms-3 ps-8 before:absolute before:start-0 before:top-0 before:-ms-px before:h-full before:w-0.5 before:bg-gray-100"
                            >
                              <!-- 3rd Level Item -->
                              <div
                                class="nested-2-4 cursor-pointer rounded-md px-2"
                                *ngFor="
                                  let grandChildCategory of childCategory.children
                                "
                              >
                                <span class="text-sm text-gray-800">
                                  <label class="flex">
                                    <input
                                      type="checkbox"
                                      class="mt-0.5 shrink-0 rounded border-gray-200 text-blue-600 focus:ring-blue-500 disabled:pointer-events-none disabled:opacity-50"
                                      value="main.css"
                                    />
                                    <span class="ms-3">{{
                                      grandChildCategory.name
                                    }}</span>
                                  </label>
                                </span>
                              </div>
                              <!-- End 3rd Level Item -->
                            </div>
                          </div>
                          <!-- End 2nd Level Collapse -->
                        </div>
                        <!-- End 2nd Level Nested Accordion -->
                      </div>
                      <!-- 2nd Level Accordion Group -->
                    </div>
                    <!-- End 1st Level Collapse -->
                  </div>
                  <!-- End 1st Level Accordion -->
                </div>
                <!-- End 1st Level Accordion Group -->
              </div>
              <!-- End Tree Root -->
            </div>
          </div>
        </div>
        <div class="border-t border-gray-200 px-4 py-6">
          <h3 class="-mx-2 -my-3 flow-root">
            <!-- Expand/collapse section button -->
            <button
              type="button"
              class="flex w-full items-center justify-between bg-white px-2 py-3 text-gray-400 hover:text-gray-500"
              aria-controls="filter-section-mobile-2"
              aria-expanded="false"
              (click)="updateBrandCollapsed()"
            >
              <span class="font-medium text-gray-900">Brand</span>
              <span class="ml-6 flex items-center">
                <!-- Expand icon, show/hide based on section open state. -->
                <app-icon
                  icon="plus"
                  classNames="h-5 w-5"
                  *ngIf="filterState.brandCollapsed"
                ></app-icon>
                <!-- Collapse icon, show/hide based on section open state. -->
                <app-icon
                  icon="minus"
                  classNames="h-5 w-5"
                  *ngIf="!filterState.brandCollapsed"
                ></app-icon>
              </span>
            </button>
          </h3>
          <!-- Filter section, show/hide based on section state. -->
          <div
            class="pt-6"
            id="filter-section-mobile-2"
            *ngIf="!filterState.brandCollapsed"
          >
            <div class="space-y-6">
              <div class="flex items-center" *ngFor="let brand of brands">
                <input
                  id="filter-mobile-size-0"
                  name="size[]"
                  value="2l"
                  type="checkbox"
                  class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500"
                />
                <label
                  for="filter-mobile-size-0"
                  class="ml-3 min-w-0 flex-1 text-gray-500"
                  >{{ brand }}</label
                >
              </div>
            </div>
          </div>
        </div>
        <div class="border-t border-gray-200 px-4 py-6">
          <h3 class="-mx-2 -my-3 flow-root">
            <!-- Expand/collapse section button -->
            <button
              type="button"
              class="flex w-full items-center justify-between bg-white px-2 py-3 text-gray-400 hover:text-gray-500"
              aria-controls="filter-section-mobile-0"
              aria-expanded="false"
              (click)="updateColorCollapsed()"
            >
              <span class="font-medium text-gray-900">Color</span>
              <span class="ml-6 flex items-center">
                <!-- Expand icon, show/hide based on section open state. -->
                <app-icon
                  icon="plus"
                  classNames="h-5 w-5"
                  *ngIf="filterState.colorCollapsed"
                ></app-icon>
                <!-- Collapse icon, show/hide based on section open state. -->
                <app-icon
                  icon="minus"
                  classNames="h-5 w-5"
                  *ngIf="!filterState.colorCollapsed"
                ></app-icon>
              </span>
            </button>
          </h3>
          <!-- Filter section, show/hide based on section state. -->
          <div
            class="pt-6"
            id="filter-section-mobile-0"
            *ngIf="!filterState.colorCollapsed"
          >
            <div class="space-y-6">
              <div class="flex items-center" *ngFor="let color of colors">
                <input
                  id="filter-mobile-color-0"
                  name="color[]"
                  value="white"
                  type="checkbox"
                  class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500"
                />
                <label
                  for="filter-mobile-color-0"
                  class="ml-3 min-w-0 flex-1 text-gray-500"
                  >{{ color }}</label
                >
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
