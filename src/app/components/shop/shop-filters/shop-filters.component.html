<form class="hidden lg:block">

  <!-- ── Category ────────────────────────────────── -->
  <div class="border-b border-gray-100 py-5">
    <button type="button" class="flex w-full items-center justify-between py-1 text-left"
      (click)="updateCategoryCollapsed()" [attr.aria-expanded]="!shopFilterState.categoryCollapsed">
      <span class="text-xs font-semibold uppercase tracking-wider text-gray-400">Category</span>
      <app-icon icon="chevron-down" classNames="h-4 w-4 text-gray-400 transition-transform duration-200"
        [class.rotate-180]="!shopFilterState.categoryCollapsed"></app-icon>
    </button>

    <div *ngIf="!shopFilterState.categoryCollapsed" class="mt-3" id="filter-section-1">
      <app-category-tree [categoryTree]="categoryTree"
        (updateCategorySelection)="updateCategorySelection($event)"></app-category-tree>
    </div>
  </div>

  <!-- ── Brand ──────────────────────────────────── -->
  <div class="border-b border-gray-100 py-5">
    <button type="button" class="flex w-full items-center justify-between py-1 text-left"
      (click)="updateBrandCollapsed()" [attr.aria-expanded]="!shopFilterState.brandCollapsed">
      <span class="text-xs font-semibold uppercase tracking-wider text-gray-400">Brand</span>
      <app-icon icon="chevron-down" classNames="h-4 w-4 text-gray-400 transition-transform duration-200"
        [class.rotate-180]="!shopFilterState.brandCollapsed"></app-icon>
    </button>

    <div *ngIf="!shopFilterState.brandCollapsed" class="mt-3 space-y-1" id="filter-section-2">
      <ng-container *ngFor="let brand of brands">
        <label [for]="brand.id"
          class="flex cursor-pointer items-center gap-x-2.5 rounded-lg px-1 py-1.5 transition-colors duration-150 hover:bg-indigo-50/70"
          [class.bg-indigo-50]="brand.checked">
          <input [id]="brand.id" [(ngModel)]="brand.checked" [name]="brand.name" [value]="brand.id" type="checkbox"
            (change)="onBrandCheckboxChange(brand)"
            class="h-3.5 w-3.5 flex-shrink-0 cursor-pointer rounded border-gray-300 text-indigo-600 shadow-sm focus:ring-2 focus:ring-indigo-400 focus:ring-offset-0" />
          <span class="text-sm transition-colors duration-150" [class.text-indigo-700]="brand.checked"
            [class.font-semibold]="brand.checked" [class.text-gray-600]="!brand.checked">{{ brand.name || brand
            }}</span>
        </label>
      </ng-container>
    </div>
  </div>

  <!-- ── Price range ────────────────────────────── -->
  <div class="border-b border-gray-100 py-5">
    <div class="flex items-center justify-between py-1">
      <span class="text-xs font-semibold uppercase tracking-wider text-gray-400">Max Price</span>
      <span class="text-sm font-bold text-indigo-600">${{ shopFilterState.priceRange }}</span>
    </div>
    <div class="mt-4 px-1">
      <input type="range" [(ngModel)]="shopFilterState.priceRange" name="priceRange" min="0" max="500" step="10"
        (change)="updateProductGridOutput.emit(this.shopFilterState)"
        class="h-1.5 w-full cursor-pointer appearance-none rounded-lg bg-gray-200 accent-indigo-600" />
      <div class="mt-2 flex items-center justify-between text-[10px] font-medium text-gray-400">
        <span>$0</span>
        <span>$500</span>
      </div>
    </div>
  </div>

  <!-- ── Color ──────────────────────────────────── -->
  <div class="py-5">
    <button type="button" class="flex w-full items-center justify-between py-1 text-left"
      (click)="updateColorCollapsed()" [attr.aria-expanded]="!shopFilterState.colorCollapsed">
      <span class="text-xs font-semibold uppercase tracking-wider text-gray-400">Color</span>
      <app-icon icon="chevron-down" classNames="h-4 w-4 text-gray-400 transition-transform duration-200"
        [class.rotate-180]="!shopFilterState.colorCollapsed"></app-icon>
    </button>

    <div *ngIf="!shopFilterState.colorCollapsed" class="mt-3 space-y-1" id="filter-section-0">
      <ng-container *ngFor="let color of colors">
        <label [for]="color.name"
          class="flex cursor-pointer items-center gap-x-2.5 rounded-lg px-1 py-1.5 transition-colors duration-150 hover:bg-indigo-50/70"
          [class.bg-indigo-50]="color.checked">
          <input [id]="color.name" [(ngModel)]="color.checked" [name]="color.name" [value]="color.name" type="checkbox"
            (change)="onColorCheckboxChange(color)"
            class="h-3.5 w-3.5 flex-shrink-0 cursor-pointer rounded border-gray-300 text-indigo-600 shadow-sm focus:ring-2 focus:ring-indigo-400 focus:ring-offset-0" />
          <span class="text-sm transition-colors duration-150" [class.text-indigo-700]="color.checked"
            [class.font-semibold]="color.checked" [class.text-gray-600]="!color.checked">{{ color.name || color
            }}</span>
        </label>
      </ng-container>
    </div>
  </div>

</form>
