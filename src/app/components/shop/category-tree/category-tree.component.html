<ng-container *ngFor="let category of categoryTree; let last = last">
  <div class="group relative" #treeItem>

    <!-- Category Row -->
    <div
      class="flex w-full items-center gap-x-1 rounded-lg px-1 py-1.5 transition-all duration-150 hover:bg-indigo-50/70 cursor-pointer"
      [class.bg-indigo-50]="category.checked">

      <!-- Expand / Collapse chevron -->
      <button *ngIf="category.children && category.children.length > 0"
        class="flex h-5 w-5 flex-shrink-0 items-center justify-center rounded text-gray-400 transition-all duration-200 hover:bg-indigo-100 hover:text-indigo-600 focus:outline-none"
        [attr.aria-expanded]="category.expanded" (click)="toggleCategory(category)" type="button">
        <!-- Inline animated chevron (no external icon dependency needed) -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"
          class="h-3.5 w-3.5 transition-transform duration-200" [class.rotate-90]="category.expanded">
          <path fill-rule="evenodd"
            d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z"
            clip-rule="evenodd" />
        </svg>
      </button>

      <!-- Spacer when no children -->
      <span *ngIf="!category.children || category.children.length === 0" class="w-5 flex-shrink-0"></span>

      <!-- Checkbox + Label -->
      <label [for]="category.id" class="flex flex-1 cursor-pointer items-center gap-x-2.5 select-none"
        (click)="$event.stopPropagation()">
        <input type="checkbox" [(ngModel)]="category.checked" [id]="category.id" [value]="category.name"
          (change)="onParentCheckboxChange(category)"
          class="h-3.5 w-3.5 flex-shrink-0 cursor-pointer rounded border-gray-300 text-indigo-600 shadow-sm transition-colors duration-150 focus:ring-2 focus:ring-indigo-400 focus:ring-offset-0 disabled:pointer-events-none disabled:opacity-50" />
        <span class="truncate text-sm font-medium transition-colors duration-150"
          [class.text-indigo-700]="category.checked" [class.font-semibold]="category.checked"
          [class.text-gray-700]="!category.checked">
          {{ category.name }}
        </span>
        <!-- Item count badge (if present in future) -->
      </label>
    </div>

    <!-- Children (animated expand) -->
    <div *ngIf="category.expanded && category.children && category.children.length > 0"
      class="relative ml-3 mt-0.5 border-l-2 border-gray-100 pl-3">
      <app-category-tree [categoryTree]="category.children!"
        (updateCategorySelection)="onChildCheckboxChange($event)"></app-category-tree>
    </div>

  </div>
</ng-container>
